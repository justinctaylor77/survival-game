<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Survival Adventure">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-transparent">
  <meta name="theme-color" content="#0d9488">
  <title>Super Survival Adventure</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --teal: #0d9488;
      --teal-dark: #0f766e;
      --ink: #134e4a;
      --card: #fffdf8;
      --good: #16a34a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    html, body {
      margin: 0; padding: 0; width: 100%;
      height: 100%; height: 100vh; height: 100dvh;
      min-height: 100vh; min-height: -webkit-fill-available;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", "Avenir Next", system-ui, sans-serif;
      color: var(--ink);
      background: #0e7490;
      overscroll-behavior: none;
    }
    body {
      position: fixed; inset: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #app {
      width: 100%;
      max-width: 430px;
      height: 100%; height: 100vh; height: 100dvh; height: 100svh;
      min-height: -webkit-fill-available;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: #0e7490;
    }
    @media (min-width: 700px) { #app { max-width: 560px; } }

    #app.theme-title, #app.theme-island { background: linear-gradient(180deg, #7dd3fc, #14b8a6); }
    #app.theme-night { background: linear-gradient(180deg, #0f172a, #164e63); color: #f8fafc; }
    #app.theme-morning { background: linear-gradient(180deg, #fde68a, #38bdf8); }
    #app.theme-tsunami { background: linear-gradient(180deg, #1e3a5f, #0369a1); color: #f8fafc; }
    #app.theme-tornado { background: linear-gradient(180deg, #475569, #94a3b8); }
    #app.theme-quake { background: linear-gradient(180deg, #fdba74, #fde68a); }
    #app.theme-win { background: linear-gradient(180deg, #f472b6, #fbbf24, #34d399); }

    .header {
      flex: 0 0 auto;
      padding: calc(8px + var(--safe-top)) 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 5;
    }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand { font-weight: 800; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; opacity: .85; }
    .stars {
      background: rgba(255,255,255,.88);
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: 15px;
      color: #92400e;
      box-shadow: 0 2px 0 rgba(0,0,0,.08);
    }
    .theme-night .stars, .theme-tsunami .stars { background: rgba(15,23,42,.7); color: #fde68a; }
    .progress {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: rgba(255,255,255,.78);
      border-radius: 999px; padding: 5px 10px;
      box-shadow: 0 2px 0 rgba(0,0,0,.08);
    }
    .theme-night .progress, .theme-tsunami .progress { background: rgba(15,23,42,.7); }
    .badge {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 16px; line-height: 1;
      background: #e2e8f0; border: 3px solid #94a3b8; opacity: .55;
    }
    .badge span { font-size: 9px; font-weight: 800; color: #334155; }
    .badge.on { opacity: 1; background: #fef9c3; border-color: #f59e0b; transform: scale(1.08); box-shadow: 0 0 0 3px rgba(245,158,11,.25); }
    .badge.done { opacity: 1; background: #bbf7d0; border-color: #16a34a; }
    .pbar { width: 26px; height: 6px; border-radius: 99px; background: #cbd5e1; overflow: hidden; }
    .pbar i { display: block; height: 100%; width: 0; background: #16a34a; border-radius: 99px; }
    .pbar.fill i { width: 100%; }

    .scene-wrap {
      flex: 0 0 auto;
      height: 40vh;
      min-height: 210px;
      max-height: 400px;
      position: relative;
      overflow: hidden;
    }
    #scene { width: 100%; height: 100%; display: block; }

    .story-wrap {
      flex: 1 1 auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
      justify-content: flex-start;
    }
    .story {
      margin: 0 12px;
      background: var(--card);
      color: var(--ink);
      border-radius: 20px;
      padding: 12px 14px 10px;
      box-shadow: 0 7px 0 rgba(15,118,110,.18);
      flex: 0 1 auto;
      overflow-y: auto;
      min-height: 0;
      max-height: 100%;
    }
    .story h2 { margin: 0 0 6px; line-height: 1.15; font-size: 1.25rem; color: #134e4a; }
    .story p { margin: 0; font-size: 1.02rem; line-height: 1.35; }
    .hint {
      margin-top: 8px;
      background: #fef3c7;
      border-radius: 14px;
      padding: 8px 10px;
      font-weight: 700;
      color: #92400e;
      font-size: 0.95rem;
    }
    .meter-wrap { margin-top: 10px; }
    .meter-label {
      display: flex; justify-content: space-between;
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
      margin-bottom: 4px; color: #0f766e;
    }
    .meter { height: 14px; background: #e2e8f0; border-radius: 99px; overflow: hidden; border: 2px solid #0f766e; }
    .meter > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #34d399, #16a34a); border-radius: 99px; transition: width .4s ease; }
    .math-q {
      margin-top: 10px;
      text-align: center;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: .04em;
      line-height: 1.15;
      color: #0f766e;
    }

    .actions {
      flex: 0 0 auto;
      padding: 10px 12px calc(14px + var(--safe-bot));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .actions.math-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    button {
      font-family: inherit;
      font-weight: 800;
      font-size: 1.12rem;
      line-height: 1.2;
      border: 3px solid #0f766e;
      background: #fff;
      color: #0f766e;
      border-radius: 18px;
      min-height: 56px;
      padding: 12px 14px;
      box-shadow: 0 5px 0 #0f766e;
      cursor: pointer;
      appearance: none;
      width: 100%;
    }
    button:active { transform: translateY(4px); box-shadow: 0 1px 0 #0f766e; }
    button.primary {
      background: #fbbf24; border-color: #b45309; color: #78350f; box-shadow: 0 5px 0 #b45309; font-size: 1.25rem;
    }
    button.primary:active { box-shadow: 0 1px 0 #b45309; }
    button:disabled, button[disabled] {
      opacity: 0.7; cursor: wait; transform: none;
    }
    button.math-ans { font-size: 1.85rem; min-height: 64px; padding: 12px 8px; }
    button.shake-btn { animation: wiggle .4s ease; }
    @keyframes wiggle {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    @keyframes pop {
      0% { transform: scale(.9); }
      100% { transform: scale(1); }
    }
    .story h2 { animation: pop .3s ease; }

    @media (orientation: landscape) and (max-height: 900px) {
      #app {
        max-width: none;
        width: 100%;
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas:
          "header header"
          "scene story"
          "scene actions";
      }
      .header { grid-area: header; padding-top: calc(6px + var(--safe-top)); }
      .scene-wrap {
        grid-area: scene;
        height: auto;
        max-height: none;
        min-height: 0;
        align-self: stretch;
      }
      .story-wrap { grid-area: story; }
      .actions { grid-area: actions; padding-bottom: calc(10px + var(--safe-bot)); }
      .math-q { font-size: 2.1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="theme-title">
    <div class="header" id="header"></div>
    <div class="scene-wrap"><canvas id="scene" aria-hidden="true"></canvas></div>
    <div class="story-wrap" id="story-wrap"></div>
    <div class="actions" id="actions"></div>
  </div>
  <script>
(function () {
  const SAVE_KEY = "superSurvivalAdventure_v3";
  const REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const app = document.getElementById("app");
  const headerEl = document.getElementById("header");
  const storyWrap = document.getElementById("story-wrap");
  const actionsEl = document.getElementById("actions");
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");

  /* Onesie colors — swap this object to restyle the costume. */
  const SUIT = {
    name: "shadow-pal",
    body: "#5a2d8c",
    bodyDark: "#3c1863",
    bodyLight: "#8b5cc4",
    cuff: "#c4a0e0",
    hood: "#4a2178",
    hoodDark: "#2c1148",
    hoodLight: "#6d3aa0",
    eye: "#dc1730",
    eyeGlow: "#ff6b7a",
    tooth: "#fff7ed",
    mouth: "#1a0a22",
    spike: "#32145a",
    outline: "#2d1848",
    shoe: "#241036",
    shoeSole: "#5a3a1a"
  };
  const SKIN = {
    base: "#f3c8aa",
    mid: "#e8b392",
    blush: "rgba(255,150,155,0.36)",
    hair: "#6b3e22",
    hairDark: "#4a2a16",
    brow: "#4a2a16",
    iris: "#4c3218",
    outline: "#5a3a28"
  };


  const LEVEL_META = [
    { id: 1, icon: "🏝️", name: "Island" },
    { id: 2, icon: "🌪️", name: "Tornado" },
    { id: 3, icon: "🏠", name: "Quake" }
  ];

  const STEPS = {
    island: [
      { id: "wood1", title: "Level 1 · Island", text: "You're on a tiny island. Let's gather wood for a cozy hut!" },
      { id: "wood2", title: "Level 1 · Island", text: "Nice find! Grab some more sturdy driftwood." },
      { id: "hut1", title: "Level 1 · Island", text: "Time to build. First, the floor and wooden posts." },
      { id: "hut2", title: "Level 1 · Island", text: "The frame is up. Let's add walls and a doorway." },
      { id: "hut3", title: "Level 1 · Island", text: "Almost a real house! Put on a sturdy roof." },
      { id: "board", title: "Level 1 · Island", text: "Look! A ship is sailing in to pick you up. Solve this to climb aboard!" }
    ],
    ship: [
      { id: "jackets", title: "Night on the ship", text: "It's nighttime on the ship. Put on a life jacket so you're ready." },
      { id: "ropes", title: "Night on the ship", text: "Now secure the ropes on deck so everything stays safe." },
      { id: "breakfast", title: "Good morning!", text: "The sun is up. It's breakfast time — fuel up for the day!" }
    ],
    tsunami: [
      { id: "wave1", title: "Lunchtime surprise!", text: "A giant wave is rolling in! Hold on tight and keep thinking." },
      { id: "wave2", title: "Ride the wave!", text: "The wave whooshes closer. Hang on — you've got this!" },
      { id: "wave3", title: "Almost to land!", text: "One more puzzle and you'll ride this wave safely to shore!" }
    ],
    tornado: [
      { id: "windows", title: "Level 2 · Tornado", text: "A spinny tornado is swirling near the house! Board up the windows." },
      { id: "supplies", title: "Level 2 · Tornado", text: "Grab a flashlight, water, and a blanket for the basement." },
      { id: "basement", title: "Level 2 · Tornado", text: "Get down to the basement — it's a safer, lower spot." },
      { id: "hold", title: "Level 2 · Tornado", text: "The tornado is roaring outside. Cover your head and hold on!" }
    ],
    quake: [
      { id: "drop", title: "Level 3 · Earthquake", text: "The ground is shaking! Drop, Cover, and Hold On under a sturdy table." },
      { id: "holdq", title: "Level 3 · Earthquake", text: "Keep holding on, away from the windows, until the wiggles settle." },
      { id: "secure", title: "Level 3 · Earthquake", text: "Stay low and think through securing loose items so they don't fall." },
      { id: "hazards", title: "Level 3 · Earthquake", text: "The shaking slowed down. Check for hazards before you move around." }
    ]
  };

  const WRONG_HINT = {
    island: "Not quite! Try another number. The tide is creeping a little closer.",
    ship: "Not quite! Try another number. You can still do this!",
    tsunami: "Not quite! Try another number. The wave rolls a little closer — you can still do this!",
    tornado: "Not quite! Try another number. The storm swirls a little closer.",
    quake: "Not quite! Try another number. The wiggles get a tiny bit stronger."
  };

  function initial() {
    return {
      scene: "title",
      step: 0,
      stars: 0,
      survival: 0,
      danger: 0,
      hint: "",
      pose: "idle",
      poseUntil: 0,
      problem: null,
      problems: [],
      island: { wood: 0, hut: 0, food: 0, ship: 0, palms: 1 },
      ship: { jackets: 0, ropes: 0, breakfast: 0 },
      tornado: { windows: 0, supplies: 0, basement: 0 },
      quake: { underTable: 0, secured: 0, checked: 0 }
    };
  }

  let state = initial();
  let particles = [];
  let debris = [];
  let rain = [];
  let confetti = [];
  let coins = [];
  let blockPulse = 0;
  let lastScene = "";
  let startTime = performance.now();

  function now() { return performance.now() / 1000; }
  function animT() { return REDUCE ? 0 : now(); }

  function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function makeProblem(op, used) {
    for (let tries = 0; tries < 80; tries++) {
      let a, b, answer, symbol;
      if (op === "+") {
        a = randInt(1, 19);
        b = randInt(1, 20 - a);
        answer = a + b;
        symbol = "+";
      } else {
        a = randInt(2, 20);
        b = randInt(1, a - 1);
        answer = a - b;
        symbol = "−";
      }
      if (b < 1) continue;
      if (answer < 0 || answer > 20) continue;
      const key = a + symbol + b;
      if (used.has(key)) continue;
      used.add(key);
      const wrong = new Set();
      let guard = 0;
      while (wrong.size < 2 && guard++ < 40) {
        const delta = randInt(1, 5) * (Math.random() < 0.5 ? 1 : -1);
        const n = answer + delta;
        if (n >= 0 && n <= 20 && n !== answer) wrong.add(n);
      }
      for (let n = 0; n <= 20 && wrong.size < 2; n++) if (n !== answer) wrong.add(n);
      return { a, b, op: symbol, answer, choices: shuffle([answer].concat(Array.from(wrong)).slice(0, 3)), key };
    }
    return op === "+"
      ? { a: 8, b: 7, op: "+", answer: 15, choices: [13, 15, 17], key: "8+7" }
      : { a: 14, b: 6, op: "−", answer: 8, choices: [6, 8, 10], key: "14−6" };
  }

  function makeProblems(count) {
    const types = shuffle([].concat(
      Array(Math.ceil(count / 2)).fill("+"),
      Array(Math.floor(count / 2)).fill("-")
    ));
    const used = new Set();
    return types.map((op) => makeProblem(op, used));
  }

  function meterMax() {
    const s = STEPS[state.scene];
    return s ? s.length : 0;
  }
  function currentStep() {
    const s = STEPS[state.scene];
    return s ? s[state.step] : null;
  }
  function levelNum() {
    const sc = state.scene;
    if (sc === "title") return 0;
    if (sc === "island" || sc === "ship" || sc === "tsunami") return 1;
    if (sc === "tornado") return 2;
    if (sc === "quake" || sc === "complete") return sc === "complete" ? 4 : 3;
    return 0;
  }

  function save() {
    try {
      const copy = Object.assign({}, state, { hint: "", pose: "idle", poseUntil: 0 });
      localStorage.setItem(SAVE_KEY, JSON.stringify(copy));
    } catch (e) { /* ignore */ }
  }
  function loadSave() {
    try {
      const data = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (!data || !data.scene) return null;
      return data;
    } catch (e) { return null; }
  }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }
  function hasContinue() {
    const s = loadSave();
    return s && s.scene && s.scene !== "title" && s.scene !== "complete";
  }

  function playTone(freq, dur, type) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!playTone.ctx || playTone.ctx.state === "closed") playTone.ctx = new Ctx();
      const c = playTone.ctx;
      const beep = () => {
        try {
          if (c.state === "closed") return;
          const o = c.createOscillator();
          const g = c.createGain();
          o.type = type || "triangle";
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, c.currentTime);
          g.gain.exponentialRampToValueAtTime(0.08, c.currentTime + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
          o.connect(g); g.connect(c.destination);
          o.start();
          o.stop(c.currentTime + dur + 0.02);
        } catch (err) { /* ignore */ }
      };
      if (c.state === "suspended") c.resume().then(beep).catch(function () {});
      else beep();
    } catch (e) { /* ignore */ }
  }
  function sfx(kind) {
    if (kind === "tap") playTone(520, 0.08);
    if (kind === "good") { playTone(660, 0.1); setTimeout(function () { playTone(880, 0.14); }, 90); }
    if (kind === "bad") playTone(240, 0.16, "sine");
    if (kind === "win") [523, 659, 784, 1046].forEach(function (f, i) { setTimeout(function () { playTone(f, 0.18); }, i * 120); });
  }

  function enterStep() {
    const sc = state.scene;
    const id = currentStep() && currentStep().id;
    if (sc === "island") {
      if (id === "board") state.island.ship = 1;
    }
    if (sc === "ship") {
      if (id === "jackets") state.ship.jackets = 1;
      if (id === "ropes") state.ship.ropes = 1;
      if (id === "breakfast") state.ship.breakfast = 1;
    }
    if (sc === "tornado") {
      if (id === "windows") state.tornado.windows = 1;
      if (id === "supplies") state.tornado.supplies = 1;
      if (id === "basement") state.tornado.basement = 1;
      if (id === "hold") state.pose = "brace";
    }
    if (sc === "quake") {
      state.pose = "brace";
      if (id === "drop" || id === "holdq") state.quake.underTable = 1;
      if (id === "secure") state.quake.secured = 1;
      if (id === "hazards") state.quake.checked = 1;
    }
    if (sc === "tsunami" || (sc === "tornado" && id === "hold") || sc === "quake") {
      if (state.poseUntil < performance.now() || sc !== "island") {
        if (sc !== "island" && sc !== "ship") state.pose = "brace";
      }
    }
  }

  function applyCorrect() {
    const sc = state.scene;
    const id = currentStep() && currentStep().id;
    if (sc === "island") {
      if (id === "wood1" || id === "wood2") state.island.wood += 1;
      if (id === "hut1") state.island.hut = Math.max(state.island.hut, 1);
      if (id === "hut2") state.island.hut = Math.max(state.island.hut, 2);
      if (id === "hut3") { state.island.hut = 3; state.island.food = 1; state.island.palms = 2; }
      if (id === "board") state.island.ship = 2;
    }
    if (sc === "ship") {
      if (id === "jackets") state.ship.jackets = 2;
      if (id === "ropes") state.ship.ropes = 2;
      if (id === "breakfast") state.ship.breakfast = 2;
    }
    if (sc === "tornado") {
      if (id === "windows") state.tornado.windows = 2;
      if (id === "supplies") state.tornado.supplies = 2;
      if (id === "basement") state.tornado.basement = 2;
    }
    if (sc === "quake") {
      if (id === "secure") state.quake.secured = 2;
      if (id === "hazards") state.quake.checked = 2;
    }
  }

  function nextSceneAfter(sc) {
    if (sc === "island") return "ship";
    if (sc === "ship") return "tsunami";
    if (sc === "tsunami") return "tornado";
    if (sc === "tornado") return "quake";
    if (sc === "quake") return "complete";
    return "complete";
  }

  function beginScene(scene) {
    state.scene = scene;
    state.step = 0;
    state.survival = 0;
    state.hint = "";
    if (scene === "complete") {
      state.pose = "cheer";
      state.poseUntil = performance.now() + 20000;
      burstConfetti();
      sfx("win");
      state.problem = null;
      state.problems = [];
    } else if (STEPS[scene]) {
      state.problems = makeProblems(STEPS[scene].length);
      state.problem = state.problems[0];
      state.pose = scene === "quake" || scene === "tsunami" ? "brace" : "idle";
      enterStep();
    }
    if (scene !== lastScene) {
      resetParticles(scene);
      lastScene = scene;
    }
    save();
    renderUI();
  }

  function startNew() {
    if (!assetsReady) return;
    sfx("tap");
    state = initial();
    state.scene = "island";
    state.problems = makeProblems(STEPS.island.length);
    state.problem = state.problems[0];
    lastScene = "";
    resetParticles("island");
    clearSave();
    enterStep();
    sfx("good");
    save();
    renderUI();
  }

  function continueGame() {
    if (!assetsReady) return;
    const saved = loadSave();
    if (!saved) return startNew();
    state = Object.assign(initial(), saved);
    if (!state.problem && STEPS[state.scene]) {
      state.problems = makeProblems(STEPS[state.scene].length);
      state.problem = state.problems[Math.min(state.step, state.problems.length - 1)];
    }
    lastScene = "";
    resetParticles(state.scene);
    renderUI();
  }

  function setPose(pose, ms) {
    state.pose = pose;
    state.poseUntil = performance.now() + (ms || 900);
  }

  function onAnswer(n, btn) {
    const p = state.problem;
    if (!p) return;
    if (n === p.answer) {
      sfx("good");
      state.stars += 2;
      state.survival += 1;
      state.hint = "";
      state.danger = Math.max(0, state.danger - 0.06);
      applyCorrect();
      popCoins(5);
      const cheerScenes = { island: 1, ship: 1 };
      setPose(cheerScenes[state.scene] ? "cheer" : (state.scene === "tsunami" || state.scene === "tornado" || state.scene === "quake" ? "brace" : "cheer"), 800);
      const sc = state.scene;
      if (state.step + 1 >= STEPS[sc].length) {
        save();
        renderUI();
        setTimeout(function () { beginScene(nextSceneAfter(sc)); }, 700);
      } else {
        state.step += 1;
        state.problem = state.problems[state.step];
        enterStep();
        save();
        renderUI();
      }
    } else {
      sfx("bad");
      state.danger = Math.min(0.72, state.danger + 0.12);
      state.hint = "💡 " + (WRONG_HINT[state.scene] || "Not quite! Try another number. You can do it!");
      if (btn) {
        btn.classList.remove("shake-btn");
        void btn.offsetWidth;
        btn.classList.add("shake-btn");
      }
      renderUI();
    }
  }

  function bindTap(el, fn) {
    let fromTouch = false;
    el.addEventListener("touchend", function (ev) {
      if (el.disabled) return;
      ev.preventDefault();
      fromTouch = true;
      fn(ev);
      setTimeout(function () { fromTouch = false; }, 400);
    }, { passive: false });
    el.addEventListener("click", function (ev) {
      if (el.disabled) return;
      if (fromTouch) { ev.preventDefault(); fromTouch = false; return; }
      fn(ev);
    });
  }

  function themeFor(sc) {
    if (sc === "title" || sc === "island") return "theme-island";
    if (sc === "ship") return state.ship.breakfast ? "theme-morning" : "theme-night";
    if (sc === "tsunami") return "theme-tsunami";
    if (sc === "tornado") return "theme-tornado";
    if (sc === "quake") return "theme-quake";
    if (sc === "complete") return "theme-win";
    return "theme-island";
  }

  function progressHtml() {
    const lvl = levelNum();
    function badge(n) {
      let cls = "badge";
      if (lvl > n) cls += " done";
      else if (lvl === n) cls += " on";
      return '<div class="' + cls + '">' + LEVEL_META[n - 1].icon + "<span>" + n + "</span></div>";
    }
    function bar(n) { return '<div class="pbar' + (lvl > n ? " fill" : "") + '"><i></i></div>'; }
    return '<div class="progress" aria-label="Level progress">' + badge(1) + bar(1) + badge(2) + bar(2) + badge(3) + "</div>";
  }

  function meterHtml(label, value, max) {
    if (!max) return "";
    const pct = Math.max(0, Math.min(100, (value / max) * 100));
    return '<div class="meter-wrap"><div class="meter-label"><span>' + label + '</span><span>' + value + "/" + max + '</span></div><div class="meter" role="meter" aria-valuenow="' + value + '" aria-valuemin="0" aria-valuemax="' + max + '"><i style="width:' + pct + '%"></i></div></div>';
  }

  function renderUI() {
    const sc = state.scene;
    app.className = themeFor(sc);
    const stars = '<div class="stars" aria-label="Stars">⭐ ' + state.stars + "</div>";
    headerEl.innerHTML = '<div class="top-row"><div class="brand">Super Survival</div>' + stars + "</div>" + progressHtml();

    let title = "", body = "", extra = "", btns = [];
    if (sc === "title") {
      title = "Super Survival Adventure";
      body = "Help the hero stay safe through 3 wild levels: a tiny island, a spinny tornado, and a wobbly earthquake. Solve addition and subtraction puzzles (numbers 0–20) to gather, build, and survive. It's all a game — you'll be okay, and you'll have fun!";
      if (!assetsReady) {
        btns = [{ label: "⏳ Loading…", act: "wait", cls: "primary", disabled: true }];
      } else {
        btns = [{ label: "▶️ Play", act: "newGame", cls: "primary" }];
        if (hasContinue()) btns.push({ label: "↪️ Continue", act: "continue" });
      }
    } else if (sc === "complete") {
      title = "You survived all 3 levels!";
      body = "You're a safety champion! You built a hut, rode a wild wave, stayed safe in a tornado, and used Drop, Cover, and Hold On in an earthquake — and you solved the puzzles along the way. Stars earned: ⭐ " + state.stars + ".";
      btns = [{ label: "🔁 Play again", act: "newGame", cls: "primary" }];
    } else {
      const st = currentStep();
      const p = state.problem;
      title = st ? st.title : "";
      body = st ? st.text : "";
      if (p) extra += '<div class="math-q" aria-live="polite">' + p.a + " " + p.op + " " + p.b + " = ?</div>";
      const label = sc === "island" ? "Island plan" : "Survival meter";
      extra += meterHtml(label, state.survival, meterMax());
      if (state.hint) extra += '<div class="hint" role="status">' + state.hint + "</div>";
      if (p) btns = p.choices.map(function (n) { return { label: String(n), act: "ans_" + n, cls: "math-ans" }; });
    }
    storyWrap.innerHTML = '<div class="story">' + (title ? "<h2>" + title + "</h2>" : "") + "<p>" + body + "</p>" + extra + "</div>";
    const isMath = btns.length && btns.every(function (b) { return (b.cls || "").indexOf("math-ans") !== -1; });
    actionsEl.className = "actions" + (isMath ? " math-grid" : "");
    actionsEl.innerHTML = btns.map(function (b) {
      return '<button type="button" class="' + (b.cls || "") + '" data-act="' + b.act + '"' + (b.disabled ? " disabled" : "") + '>' + b.label + "</button>";
    }).join("");
    actionsEl.querySelectorAll("button[data-act]").forEach(function (btn) {
      bindTap(btn, function () {
        const act = btn.getAttribute("data-act");
        if (act === "newGame") startNew();
        else if (act === "continue") continueGame();
        else if (act && act.indexOf("ans_") === 0) onAnswer(Number(act.slice(4)), btn);
      });
    });
    sizeCanvas();
  }

  /* ---------- canvas helpers ---------- */
  function sizeCanvas() {
    const wrap = canvas.parentElement;
    const rect = wrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w: w, h: h };
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function fillRound(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function strokeFill(ctx, fill, stroke, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke(); }
  }

  function drawCloud(ctx, x, y, s, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha == null ? 0.9 : alpha;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x, y, 16 * s, 0, Math.PI * 2);
    ctx.arc(x + 18 * s, y - 8 * s, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 38 * s, y, 16 * s, 0, Math.PI * 2);
    ctx.arc(x + 20 * s, y + 6 * s, 14 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSun(ctx, x, y, r, t) {
    ctx.save();
    ctx.fillStyle = "rgba(253, 224, 71, 0.35)";
    ctx.beginPath(); ctx.arc(x, y, r * 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawMoon(ctx, x, y, r) {
    ctx.save();
    ctx.fillStyle = "#fef9c3";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(15,23,42,0.15)";
    ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.15, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.25, y + r * 0.2, r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawWaves(ctx, w, h, baseY, t, amp, colors) {
    colors.forEach(function (col, i) {
      const y0 = baseY + i * 14;
      const a = amp * (1 - i * 0.15);
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(0, y0);
      for (let x = 0; x <= w + 8; x += 6) {
        const y = y0
          + Math.sin(x * 0.018 + t * 1.8 + i) * a
          + Math.sin(x * 0.05 + t * 2.4 + i * 0.7) * a * 0.35;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
    });
  }

  function drawPalm(ctx, x, y, scale, t, lean) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.rotate((lean || 0) + Math.sin(t * 1.4) * 0.03);
    ctx.fillStyle = "#8b5a2b";
    ctx.strokeStyle = "#5c3a1a";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.quadraticCurveTo(-4, -50, 0, -96);
    ctx.quadraticCurveTo(5, -50, 8, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(60,30,10,0.35)";
    ctx.beginPath(); ctx.moveTo(-1, -8); ctx.quadraticCurveTo(2, -50, 1, -90); ctx.stroke();
    const greens = ["#15803d", "#22c55e", "#16a34a", "#166534"];
    for (let i = 0; i < 7; i++) {
      const ang = -Math.PI / 2 + (i - 3) * 0.42 + Math.sin(t + i) * 0.04;
      const len = 38 + (i % 2 ? 8 : 0);
      ctx.save();
      ctx.translate(0, -96);
      ctx.rotate(ang);
      ctx.fillStyle = greens[i % greens.length];
      ctx.strokeStyle = "#14532d";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(len * 0.5, -12, len, 0);
      ctx.quadraticCurveTo(len * 0.5, 10, 0, 0);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = "#6b3f16";
    ctx.beginPath(); ctx.arc(0, -96, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawHut(ctx, x, y, scale, stage, t) {
    if (stage <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const outline = "#5c3a1a";
    // platform
    ctx.fillStyle = "#b45309";
    ctx.strokeStyle = outline;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-48, 0); ctx.lineTo(48, 0); ctx.lineTo(40, 10); ctx.lineTo(-40, 10);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if (stage >= 1) {
      // posts
      ctx.fillStyle = "#92400e";
      [[-36, 0, -32, -44], [32, 0, 36, -44], [-16, 0, -12, -44], [12, 0, 16, -44]].forEach(function (p) {
        ctx.fillRect(p[0], p[3], 6, -p[3]);
        ctx.strokeRect(p[0], p[3], 6, -p[3]);
      });
    }
    if (stage >= 2) {
      ctx.fillStyle = "#fde68a";
      ctx.strokeStyle = outline;
      ctx.lineWidth = 3;
      fillRound(ctx, -38, -44, 76, 44, 2);
      ctx.fill(); ctx.stroke();
      // door hole
      ctx.fillStyle = "#7c4a1e";
      fillRound(ctx, -10, -28, 20, 28, 3);
      ctx.fill(); ctx.stroke();
      // window
      ctx.fillStyle = "#7dd3fc";
      fillRound(ctx, 16, -34, 14, 12, 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(23, -34); ctx.lineTo(23, -22); ctx.moveTo(16, -28); ctx.lineTo(30, -28); ctx.stroke();
    }
    if (stage >= 3) {
      ctx.fillStyle = "#c2410c";
      ctx.strokeStyle = outline;
      ctx.beginPath();
      ctx.moveTo(-48, -42);
      ctx.lineTo(0, -78);
      ctx.lineTo(48, -42);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // chimney
      ctx.fillStyle = "#78716c";
      ctx.fillRect(18, -70, 10, 16);
      ctx.strokeRect(18, -70, 10, 16);
      // puff
      ctx.fillStyle = "rgba(148,163,184,0.7)";
      ctx.beginPath();
      ctx.arc(23 + Math.sin(t) * 3, -78 - (t * 12 % 16), 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawWoodPile(ctx, x, y, n) {
    if (n <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    const blocks = Math.min(n, 3);
    const s = 14;
    for (let i = 0; i < blocks; i++) {
      const bx = (i % 2) * 7 - 12;
      const by = -i * (s - 3);
      const light = i % 2 ? "#c4a36a" : "#b45309";
      const dark = i % 2 ? "#8b5a2b" : "#7c3f12";
      drawPixelBlock(ctx, bx, by, s, s, light, dark);
    }
    ctx.restore();
  }

  function drawFish(ctx, x, y, t) {
    const bob = Math.sin(t * 2.2) * 5;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.fillStyle = "#0ea5e9";
    ctx.strokeStyle = "#075985";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 7, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(12, 0); ctx.lineTo(22, -7); ctx.lineTo(22, 7); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-6, -1, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(-5.5, -1, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* Full-body boy — feet at (x,y), drawn upward.
     Stylized 7-year-old, ~5 heads tall, clean flat vector.
     Hood is DOWN: a small, soft fabric hood (head-sized or smaller). */
  function drawBoy(ctx, x, y, scale, pose, t, extras) {
    extras = extras || {};
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const S = SUIT;
    const K = SKIN;

    let bob = Math.sin(t * 3.1) * 1.1;
    if (pose === "cheer") bob = -Math.abs(Math.sin(t * 7)) * 5;
    const crouch = pose === "brace" ? 6 : 0;
    ctx.translate(0, bob);

    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    ctx.fillStyle = "rgba(0,0,0,0.16)";
    ctx.beginPath();
    ctx.ellipse(0, 2.8, 12, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();

    function capsule(x1, y1, x2, y2, width, fill, strokeCol, lw) {
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      ctx.save();
      ctx.translate(x1, y1);
      ctx.rotate(Math.atan2(dy, dx));
      ctx.fillStyle = fill;
      ctx.strokeStyle = strokeCol || S.outline;
      ctx.lineWidth = lw == null ? 2 : lw;
      fillRound(ctx, 0, -width / 2, len, width, width / 2);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    /* 5-heads-tall child: head ~20, total height 100. */
    const hy = -90 + crouch * 0.08;
    const neckY = -80 + crouch * 0.1;
    const shY = -75 + crouch * 0.16;
    const hipY = -40 + crouch * 0.4;
    const footY = 0;
    const legSpread = pose === "cheer" ? 7 : (pose === "brace" ? 8 : 5.5);

    /* Small hood, draped behind the neck and left shoulder. */
    (function drawHoodDown() {
      ctx.fillStyle = S.hood;
      ctx.strokeStyle = S.outline;
      ctx.lineWidth = 1.8;

      /* Short ear points on a small nape cowl. */
      ctx.beginPath();
      ctx.moveTo(-6.4, -80);
      ctx.lineTo(-8.6, -86.5);
      ctx.lineTo(-3.4, -79.5);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(3.4, -79.5);
      ctx.lineTo(6.8, -85.5);
      ctx.lineTo(5.8, -78.5);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = S.hoodLight;
      ctx.beginPath();
      ctx.moveTo(-5.8, -80);
      ctx.lineTo(-7.6, -85);
      ctx.lineTo(-4.4, -79.5);
      ctx.fill();

      /* Soft hood, smaller than the head, draped at the neck / left shoulder. */
      ctx.fillStyle = S.hood;
      ctx.beginPath();
      ctx.ellipse(-4, -72, 9.4, 8, -0.08, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = "rgba(139,92,196,0.35)";
      ctx.beginPath();
      ctx.ellipse(-7, -73, 4, 4.8, -0.15, 0, Math.PI * 2);
      ctx.fill();

      /* Tiny stitched face on the visible left of the hood. */
      ctx.fillStyle = S.eye;
      ctx.beginPath(); ctx.ellipse(-8.8, -73.6, 1.45, 1.05, -0.15, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-4.2, -74, 1.45, 1.05, 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = S.eyeGlow;
      ctx.beginPath(); ctx.arc(-9.2, -73.9, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-4.5, -74.3, 0.4, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = S.mouth;
      ctx.beginPath();
      ctx.ellipse(-6.5, -69.6, 3.6, 1.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = S.tooth;
      ctx.fillRect(-8.4, -70.4, 1.2, 1.3);
      ctx.fillRect(-6.9, -70.5, 1.2, 1.3);
      ctx.fillRect(-5.4, -70.4, 1.2, 1.3);
    })();

    /* Tiny back spikes along the right side. */
    ctx.fillStyle = S.spike;
    ctx.strokeStyle = S.outline;
    ctx.lineWidth = 1.5;
    [[9, -70, 3.2], [9.2, -65, 2.8], [9, -60, 2.4]].forEach(function (sp) {
      ctx.beginPath();
      ctx.moveTo(6, sp[1] - 2);
      ctx.lineTo(sp[0] + sp[2], sp[1]);
      ctx.lineTo(6, sp[1] + 2);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    });

    /* Legs + booties + ankle cuffs. */
    capsule(-legSpread, hipY, -legSpread, footY - 7, 7.2, S.body, S.outline, 2);
    capsule(legSpread, hipY, legSpread, footY - 7, 7.2, S.body, S.outline, 2);

    function shoeAt(sx, flip) {
      ctx.fillStyle = S.cuff;
      ctx.strokeStyle = S.outline;
      ctx.lineWidth = 1.7;
      fillRound(ctx, sx - 4.4, footY - 10, 8.8, 4.4, 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = S.shoe;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(sx + flip * 2.2, footY - 2.4, 6.2, 3.4, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = S.shoeSole;
      ctx.beginPath();
      ctx.ellipse(sx + flip * 2, footY + 0.6, 5.6, 1.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    shoeAt(-legSpread, -1);
    shoeAt(legSpread, 1);

    /* Hips + short torso. */
    ctx.fillStyle = S.body;
    ctx.strokeStyle = S.outline;
    ctx.lineWidth = 2;
    fillRound(ctx, -10, hipY - 4, 20, 11, 5.5);
    ctx.fill(); ctx.stroke();

    const torsoH = (hipY + 5) - (shY - 2);
    fillRound(ctx, -10.5, shY - 2, 21, torsoH, 8);
    ctx.fill(); ctx.stroke();
    /* Soft shading only — no noisy texture. */
    ctx.fillStyle = "rgba(155,110,210,0.32)";
    fillRound(ctx, -7, shY + 4, 8, 16, 5);
    ctx.fill();
    ctx.fillStyle = "rgba(40,16,70,0.18)";
    fillRound(ctx, 3.5, shY + 5, 5.5, 18, 4);
    ctx.fill();

    /* Zipper line down the chest. */
    ctx.strokeStyle = "#d4b8ec";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(0, shY + 1);
    ctx.lineTo(0, hipY - 2);
    ctx.stroke();
    ctx.fillStyle = "#e8d4f8";
    ctx.strokeStyle = S.outline;
    ctx.lineWidth = 1.3;
    fillRound(ctx, -1.5, shY + 0.5, 3, 4, 1);
    ctx.fill(); ctx.stroke();

    if (extras.lifeJacket) {
      ctx.fillStyle = "#facc15";
      ctx.strokeStyle = S.outline;
      ctx.lineWidth = 2;
      fillRound(ctx, -12.5, shY + 2, 25, 18, 5);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#dc2626";
      ctx.fillRect(-3.5, shY + 3.5, 7, 15);
      ctx.strokeRect(-3.5, shY + 3.5, 7, 15);
    }

    const swing = Math.sin(t * 3.1) * 1.6;
    let lHand, rHand;
    if (pose === "cheer") {
      lHand = [-16, shY - 28];
      rHand = [16, shY - 28];
    } else if (pose === "brace") {
      lHand = [-11, hy - 4];
      rHand = [11, hy - 4];
    } else if (pose === "work") {
      lHand = [-17, hipY + 4 + swing];
      rHand = [16, hipY - 4 - swing];
    } else {
      lHand = [-14, hipY + 3 + swing];
      rHand = [14, hipY + 3 - swing];
    }
    const lSh = [-10, shY + 3], rSh = [10, shY + 3];
    const idleBend = (pose === "idle" || pose === "work") ? 1 : 0;
    const lEl = [(lSh[0] + lHand[0]) / 2 - 3 * idleBend, (lSh[1] + lHand[1]) / 2 + 5 * idleBend];
    const rEl = [(rSh[0] + rHand[0]) / 2 + 3 * idleBend, (rSh[1] + rHand[1]) / 2 + 5 * idleBend];
    capsule(lSh[0], lSh[1], lEl[0], lEl[1], 6.4, S.body, S.outline, 2);
    capsule(rSh[0], rSh[1], rEl[0], rEl[1], 6.4, S.body, S.outline, 2);
    capsule(lEl[0], lEl[1], lHand[0], lHand[1], 5.6, S.body, S.outline, 2);
    capsule(rEl[0], rEl[1], rHand[0], rHand[1], 5.6, S.body, S.outline, 2);

    function cuffAt(cx, cy) {
      ctx.fillStyle = S.cuff;
      ctx.strokeStyle = S.outline;
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    cuffAt((lEl[0] + lHand[0]) / 2, (lEl[1] + lHand[1]) / 2);
    cuffAt((rEl[0] + rHand[0]) / 2, (rEl[1] + rHand[1]) / 2);

    /* Matching mitten hands — same rounded shape on both sides. */
    function mitten(mx, my) {
      ctx.fillStyle = K.base;
      ctx.strokeStyle = K.outline;
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      ctx.arc(mx, my, 3.8, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
    mitten(lHand[0], lHand[1]);
    mitten(rHand[0], rHand[1]);

    /* Short neck. */
    ctx.fillStyle = K.base;
    ctx.strokeStyle = "#c17a58";
    ctx.lineWidth = 1.5;
    fillRound(ctx, -3.6, neckY - 1.2, 7.2, 7, 2.4);
    ctx.fill(); ctx.stroke();

    /* Hair sits on TOP of the skull only. The face is as wide as the hair
       and extends lower, so no brown can wrap the jaw. */
    ctx.fillStyle = K.hair;
    ctx.beginPath();
    ctx.ellipse(0, hy - 4.4, 10.3, 10.6, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Clean face — skin-toned outline, no dark jaw ring. */
    const faceLine = "#c17a58";
    ctx.fillStyle = K.base;
    ctx.strokeStyle = faceLine;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, hy + 0.8, 10.4, 10.4, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    /* Little ears at the sides, not covered in hair. */
    ctx.fillStyle = K.base;
    ctx.strokeStyle = faceLine;
    ctx.beginPath(); ctx.ellipse(-10.0, hy + 1.4, 2.2, 2.9, -0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(10.0, hy + 1.4, 2.2, 2.9, 0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    /* Smooth short bangs — forehead only. */
    ctx.fillStyle = K.hair;
    ctx.beginPath();
    ctx.moveTo(-9.6, hy - 4.2);
    ctx.quadraticCurveTo(-5.8, hy - 3.2, -2.8, hy - 6.2);
    ctx.quadraticCurveTo(0, hy - 3.8, 2.8, hy - 6.2);
    ctx.quadraticCurveTo(5.8, hy - 3.2, 9.6, hy - 4.2);
    ctx.quadraticCurveTo(10.0, hy - 10.6, 0, hy - 14.6);
    ctx.quadraticCurveTo(-10.0, hy - 10.6, -9.6, hy - 4.2);
    ctx.fill();
    /* Tiny temple hair, stopping well above the cheeks. */
    ctx.beginPath();
    ctx.moveTo(-9.8, hy - 3.4);
    ctx.quadraticCurveTo(-10.4, hy - 1.0, -9.2, hy + 0.2);
    ctx.quadraticCurveTo(-9.6, hy - 1.6, -9.4, hy - 3.0);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(9.8, hy - 3.4);
    ctx.quadraticCurveTo(10.4, hy - 1.0, 9.2, hy + 0.2);
    ctx.quadraticCurveTo(9.6, hy - 1.6, 9.4, hy - 3.0);
    ctx.fill();
    /* Hair outline along the top only. */
    ctx.strokeStyle = K.hairDark;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(0, hy - 4.4, 10.3, 10.6, 0, Math.PI * 1.08, Math.PI * 1.92, false);
    ctx.stroke();

    const blinkT = t % 5;
    const blink = !REDUCE && blinkT > 4.86 && blinkT < 4.96;
    const eyeY = hy + 0.5;
    if (!blink) {
      function eye(ex) {
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = K.outline;
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.ellipse(ex, eyeY, 2.15, 2.3, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = K.iris;
        ctx.beginPath(); ctx.arc(ex + 0.12, eyeY + 0.15, 1.25, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#1a1008";
        ctx.beginPath(); ctx.arc(ex + 0.12, eyeY + 0.15, 0.62, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(ex + 0.55, eyeY - 0.4, 0.48, 0, Math.PI * 2); ctx.fill();
      }
      eye(-3.8);
      eye(3.8);
    } else {
      ctx.strokeStyle = K.outline;
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-6.2, eyeY); ctx.quadraticCurveTo(-3.8, eyeY + 0.7, -1.4, eyeY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(1.4, eyeY); ctx.quadraticCurveTo(3.8, eyeY + 0.7, 6.2, eyeY); ctx.stroke();
    }

    /* Simple eyebrows. */
    ctx.strokeStyle = K.brow;
    ctx.lineWidth = 1.15;
    if (pose === "brace") {
      ctx.beginPath(); ctx.moveTo(-6.0, eyeY - 4.8); ctx.lineTo(-2.4, eyeY - 4.0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6.0, eyeY - 4.8); ctx.lineTo(2.4, eyeY - 4.0); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-6.0, eyeY - 4.6); ctx.quadraticCurveTo(-4.0, eyeY - 5.5, -2.4, eyeY - 4.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2.4, eyeY - 4.6); ctx.quadraticCurveTo(4.0, eyeY - 5.5, 6.0, eyeY - 4.6); ctx.stroke();
    }

    /* Tiny nose — a short, light tick. No jaw shading. */
    ctx.strokeStyle = "rgba(74,48,32,0.5)";
    ctx.lineWidth = 1.15;
    ctx.beginPath();
    ctx.moveTo(0, hy + 4.0);
    ctx.quadraticCurveTo(0.9, hy + 5.5, 0, hy + 5.7);
    ctx.stroke();

    /* Simple friendly mouth. No second lip line. */
    ctx.strokeStyle = "#a85a48";
    ctx.lineWidth = 1.3;
    if (pose === "cheer") {
      ctx.fillStyle = "#c46a6e";
      ctx.beginPath();
      ctx.arc(0, hy + 7.2, 3.2, 0.15, Math.PI - 0.15);
      ctx.fill();
      ctx.stroke();
    } else if (pose === "brace") {
      ctx.beginPath();
      ctx.arc(0, hy + 8.4, 2.2, 0.25, Math.PI - 0.25);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(0, hy + 7.0, 3.0, 0.18, Math.PI - 0.18);
      ctx.stroke();
    }

    /* Soft blush, no outline. */
    ctx.fillStyle = K.blush;
    ctx.beginPath(); ctx.ellipse(-6.4, hy + 5.4, 2.4, 1.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6.4, hy + 5.4, 2.4, 1.4, 0, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }


  function drawBoyPortraitScene(ctx, w, h, t) {

  /* Original lookalike props — no official art, logos, or names on screen. */

  function drawPixelBlock(ctx, x, y, w, h, light, dark, top) {
    ctx.fillStyle = light;
    ctx.fillRect(x, y - h, w, h);
    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.moveTo(x + w, y - h);
    ctx.lineTo(x + w + w * 0.28, y - h - h * 0.22);
    ctx.lineTo(x + w + w * 0.28, y - h * 0.22);
    ctx.lineTo(x + w, y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = top || "#e8d5a3";
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x + w * 0.28, y - h - h * 0.22);
    ctx.lineTo(x + w + w * 0.28, y - h - h * 0.22);
    ctx.lineTo(x + w, y - h);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#3f2a1c";

  function drawPixelTree(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const u = 7;
    ctx.fillStyle = "#8b5a2b";
    ctx.strokeStyle = "#3f2a1c";
    ctx.lineWidth = 1.5;
    ctx.fillRect(-u, -5 * u, 2 * u, 5 * u);
    ctx.strokeRect(-u, -5 * u, 2 * u, 5 * u);
    const cells = [
      [-3, -8], [-2, -8], [-1, -8], [0, -8], [1, -8],
      [-4, -7], [-3, -7], [-2, -7], [-1, -7], [0, -7], [1, -7], [2, -7],
      [-4, -6], [-3, -6], [-2, -6], [-1, -6], [0, -6], [1, -6], [2, -6],
      [-3, -5], [-2, -5], [-1, -5], [0, -5], [1, -5],
      [-2, -9], [-1, -9], [0, -9]
    ];
    cells.forEach(function (c, i) {
      ctx.fillStyle = i % 5 === 0 ? "#4d7c0f" : (i % 3 === 0 ? "#65a30d" : "#3f6212");
      ctx.fillRect(c[0] * u, c[1] * u, u, u);
      ctx.strokeStyle = "#1a2e05";
      ctx.lineWidth = 0.8;
      ctx.strokeRect(c[0] * u, c[1] * u, u, u);

  }

  function drawPineappleHouse(ctx, x, y, scale, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.ellipse(0, 4, 22, 5, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#e8b423";
    ctx.strokeStyle = "#8a5a12";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.ellipse(0, -28, 22, 32, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#c98914";
    ctx.lineWidth = 1.4;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 6 - 2, -54);
      ctx.lineTo(i * 6 + 10, -4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(i * 6 + 2, -54);
      ctx.lineTo(i * 6 - 10, -4);
      ctx.stroke();
    }

    const sway = Math.sin(t * 2) * 0.08;
    ctx.save();
    ctx.translate(0, -58);
    ctx.rotate(sway);
    ctx.fillStyle = "#3f8c2a";
    ctx.strokeStyle = "#1f4d12";
    ctx.lineWidth = 1.6;
    for (let i = -3; i <= 3; i++) {

    ctx.fillStyle = "#7dd3fc";
    ctx.strokeStyle = "#8a5a12";

    ctx.fillStyle = "#7c4a1e";

  function drawJellyfish(ctx, x, y, scale, t, phase) {
    phase = phase || 0;
    const bob = Math.sin(t * 1.6 + phase) * 6;
    const pulse = 1 + Math.sin(t * 2.2 + phase) * 0.06;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(scale * pulse, scale);
    ctx.fillStyle = "rgba(244, 114, 182, 0.55)";
    ctx.strokeStyle = "rgba(190, 24, 93, 0.7)";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(253, 164, 175, 0.5)";
    ctx.beginPath(); ctx.ellipse(0, -2, 8, 5, 0, 0, Math.PI * 2); ctx.fill();

      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(i * 3, 8);

  function drawBubbles(ctx, x, y, t, n) {
    n = n || 5;
    for (let i = 0; i < n; i++) {
      const up = ((t * 18 + i * 17) % 50);
      const bx = x + Math.sin(t * 1.4 + i) * 8;
      const by = y - up;
      const r = 2 + (i % 3);
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.8)";

  function drawYellowBuddy(ctx, x, y, scale, pose, t) {
    pose = pose || "idle";

    const bob = pose === "cheer" ? -Math.abs(Math.sin(t * 8)) * 6 : Math.sin(t * 3) * 1.5;

    ctx.moveTo(10, -8);
    ctx.lineTo(22, -18);

    ctx.lineTo(12, -2);
