    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(0, -6, 14, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = bodyDk;
    ctx.beginPath(); ctx.ellipse(-4, -10, 4, 3.2, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4, -10, 4, 3.2, 0.3, 0, Math.PI * 2); ctx.fill();

    function ear(ex, lean) {
      ctx.save();
      ctx.translate(ex, -18);
      ctx.rotate(lean);
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(-3, 0);
      ctx.quadraticCurveTo(-2, -16, 0, -22);
      ctx.quadraticCurveTo(3, -16, 3, 0);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#5c3a1a";
      ctx.beginPath();
      ctx.moveTo(-2, -14);
      ctx.quadraticCurveTo(0, -22, 2, -14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ear(-6, -0.15);
    ear(6, 0.15);

    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(0, -22, 11, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#f43f5e";
    ctx.beginPath(); ctx.ellipse(-7, -19, 3, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7, -19, 3, 2.2, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#1a1008";
    ctx.beginPath(); ctx.ellipse(-3.5, -23, 1.7, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3.5, -23, 1.7, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-3, -23.6, 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -23.6, 0.6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#5c3a1a";
    ctx.beginPath(); ctx.ellipse(0, -20, 1.5, 1.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -17.5, 3.2, 0.15, Math.PI - 0.15);
    ctx.stroke();

    function paw(px, py) {
      ctx.fillStyle = body;
      ctx.strokeStyle = outline;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    if (pose === "cheer") {
      paw(-16, -32);
      paw(16, -32);
      ctx.strokeStyle = body;
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-8, -10); ctx.lineTo(-16, -30); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, -10); ctx.lineTo(16, -30); ctx.stroke();
    } else {
      paw(-16, -8);
      paw(16, -8);
    }
    ctx.fillStyle = body;
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(-7, 0, 4, 5, 0.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(7, 0, 4, 5, -0.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    if (pose === "cheer") {
      ctx.strokeStyle = "rgba(250, 204, 21, 0.9)";
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 3; i++) {
        const a = t * 6 + i * 2.1;
        const sx = Math.cos(a) * 22, sy = -24 + Math.sin(a) * 10;
        ctx.beginPath();
        ctx.moveTo(sx - 3, sy); ctx.lineTo(sx + 3, sy);
        ctx.moveTo(sx, sy - 3); ctx.lineTo(sx, sy + 3);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function popCoins(n) {
    n = n || 5;
    for (let i = 0; i < n; i++) {
      coins.push({
        x: 0.42 + Math.random() * 0.2,
        y: 0.4 + Math.random() * 0.12,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -0.7 - Math.random() * 0.3,
        rot: Math.random() * Math.PI,
        rv: 5 + Math.random() * 7,
        life: 1.15,
        wait: i * 0.05
      });
    }
    blockPulse = 1;
  }

  function updateCoins(dt) {
    if (blockPulse > 0) blockPulse = Math.max(0, blockPulse - dt * 2.8);
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      if (c.wait > 0) { c.wait -= dt; continue; }
      c.vy += 1.6 * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.rot += c.rv * dt;
      c.life -= dt * 0.85;
      if (c.life <= 0 || c.y > 1.2) coins.splice(i, 1);
    }
  }

  function drawFx(ctx, w, h) {
    coins.forEach(function (c) {
      const a = Math.max(0, Math.min(1, c.life));
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(c.x * w, c.y * h);
      ctx.rotate(c.rot);
      const squish = 0.35 + Math.abs(Math.cos(c.rot * 2)) * 0.65;
      ctx.fillStyle = "#f5c518";
      ctx.strokeStyle = "#b45309";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, 9 * squish, 9, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fde68a";
      ctx.beginPath();
      ctx.ellipse(0, 0, 5 * squish, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawSky(ctx, w, h, kind, t, danger) {
    let g = ctx.createLinearGradient(0, 0, 0, h);
    if (kind === "day") {
      g.addColorStop(0, "#7dd3fc"); g.addColorStop(1, "#38bdf8");
    } else if (kind === "morning") {
      g.addColorStop(0, "#fde68a"); g.addColorStop(0.45, "#fdba74"); g.addColorStop(1, "#7dd3fc");
    } else if (kind === "night") {
      g.addColorStop(0, "#0b1220"); g.addColorStop(1, "#1e3a5f");
    } else if (kind === "storm") {
      const d = danger || 0;
      g.addColorStop(0, lerpColor("#64748b", "#1e293b", d));
      g.addColorStop(1, lerpColor("#94a3b8", "#334155", d));
    } else if (kind === "tsunami") {
      g.addColorStop(0, "#1e3a5f"); g.addColorStop(1, "#0e7490");
    } else if (kind === "win") {
      g.addColorStop(0, "#f9a8d4"); g.addColorStop(0.5, "#fde047"); g.addColorStop(1, "#6ee7b7");
    } else if (kind === "room") {
      g.addColorStop(0, "#fed7aa"); g.addColorStop(1, "#fde68a");
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  function lerpColor(a, b, t) {
    function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
    const A = hex(a), B = hex(b);
    const r = Math.round(lerp(A[0], B[0], t));
    const g = Math.round(lerp(A[1], B[1], t));
    const bl = Math.round(lerp(A[2], B[2], t));
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  function drawStarsSky(ctx, w, h, t) {
    ctx.fillStyle = "#fde047";
    for (let i = 0; i < 28; i++) {
      const x = (i * 97) % w;
      const y = 10 + (i * 53) % (h * 0.45);
      const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * 2 + i));
      ctx.globalAlpha = tw;
      ctx.beginPath(); ctx.arc(x, y, 1.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawShip(ctx, x, y, scale, t, night) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const bob = Math.sin(t * 1.5) * 3;
    ctx.translate(0, bob);
    const outline = "#1e293b";
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";

    // hull
    ctx.fillStyle = "#1e3a5f";
    ctx.strokeStyle = outline;
    ctx.beginPath();
    ctx.moveTo(-130, 10);
    ctx.lineTo(-110, 38);
    ctx.lineTo(100, 38);
    ctx.lineTo(130, 8);
    ctx.lineTo(110, -8);
    ctx.lineTo(-115, -8);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // red waterline
    ctx.fillStyle = "#b91c1c";
    ctx.fillRect(-108, 24, 210, 10);
    ctx.strokeRect(-108, 24, 210, 10);

    // decks / superstructure
    ctx.fillStyle = "#f1f5f9";
    fillRound(ctx, -70, -48, 150, 42, 4);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#e2e8f0";
    fillRound(ctx, -30, -72, 90, 28, 4);
    ctx.fill(); ctx.stroke();

    // portholes
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = night ? "#fde047" : "#7dd3fc";
      ctx.beginPath(); ctx.arc(-50 + i * 22, -24, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = outline; ctx.lineWidth = 2; ctx.stroke();
    }
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = night ? "#fde047" : "#7dd3fc";
      ctx.beginPath(); ctx.arc(-10 + i * 20, -56, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    // funnels (Titanic-style buff + black top)
    function funnel(fx) {
      ctx.fillStyle = "#d4a017";
      ctx.strokeStyle = outline;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(fx - 9, -72);
      ctx.lineTo(fx - 7, -118);
      ctx.lineTo(fx + 11, -118);
      ctx.lineTo(fx + 9, -72);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#111827";
      ctx.fillRect(fx - 8, -118, 20, 14);
      ctx.strokeRect(fx - 8, -118, 20, 14);
    }
    funnel(0); funnel(28); funnel(56); funnel(84);

    // bow railing hint
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-115, -8); ctx.lineTo(-125, -22); ctx.stroke();

    // flag
    ctx.strokeStyle = outline;
    ctx.beginPath(); ctx.moveTo(-40, -72); ctx.lineTo(-40, -128); ctx.stroke();
    ctx.fillStyle = "#dc2626";
    ctx.beginPath(); ctx.moveTo(-40, -128); ctx.lineTo(-18, -120); ctx.lineTo(-40, -112); ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.restore();
  }

  function drawSmoke(ctx, t, ox, oy, scale) {
    particles.forEach(function (p) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = "rgba(148,163,184,1)";
      ctx.beginPath();
      ctx.arc(ox + p.x * scale, oy + p.y * scale, p.r * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function resetParticles(scene) {
    if (typeof resetSceneFx === "function") resetSceneFx();
    particles = [];
    debris = [];
    rain = [];
    coins = [];
    blockPulse = 0;
    if (scene === "complete") burstConfetti();
    else confetti = [];
    if (scene === "ship" || scene === "tsunami") {
      for (let i = 0; i < 18; i++) {
        particles.push({ x: (i % 4) * 28 + Math.random() * 8, y: -120 - Math.random() * 40, r: 5 + Math.random() * 6, life: 0.4 + Math.random() * 0.5, vy: -12 - Math.random() * 10, vx: 8 + Math.random() * 10 });
      }
    }
    if (scene === "tornado") {
      for (let i = 0; i < 70; i++) {
        rain.push({ x: Math.random(), y: Math.random(), len: 8 + Math.random() * 10, sp: 1 + Math.random() });
      }
      for (let i = 0; i < 14; i++) {
        debris.push({ a: Math.random() * Math.PI * 2, r: 30 + Math.random() * 80, z: Math.random(), s: 4 + Math.random() * 8, rot: Math.random() * 6, kind: i % 3 });
      }
    }
    if (scene === "tsunami") {
      for (let i = 0; i < 24; i++) {
        debris.push({ x: Math.random(), y: Math.random() * 0.3, vx: -0.5 - Math.random(), life: 1, r: 2 + Math.random() * 4 });
      }
    }
  }

  function burstConfetti() {
    confetti = [];
    const cols = ["#ef4444", "#f59e0b", "#eab308", "#22c55e", "#3b82f6", "#a855f7", "#ec4899"];
    for (let i = 0; i < 70; i++) {
      confetti.push({
        x: Math.random(), y: -0.1 - Math.random() * 0.3,
        vx: (Math.random() - 0.5) * 0.15, vy: 0.15 + Math.random() * 0.25,
        rot: Math.random() * 6, rv: (Math.random() - 0.5) * 6,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        c: cols[i % cols.length]
      });
    }
  }

  function updateParticles(dt, scene, t, w, h) {
    if (scene === "ship" || scene === "tsunami") {
      particles.forEach(function (p) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 0.35;
        p.r += dt * 4;
        if (p.life <= 0 || p.y < -200) {
          p.x = (Math.random() * 90);
          p.y = -120;
          p.r = 5 + Math.random() * 5;
          p.life = 0.8;
          p.vx = 8 + Math.random() * 10;
          p.vy = -12 - Math.random() * 8;
        }
      });
    }
    if (scene === "tornado") {
      rain.forEach(function (r) {
        r.y += dt * 1.3 * r.sp;
        r.x += dt * 0.15;
        if (r.y > 1) { r.y = -0.05; r.x = Math.random(); }
      });
      debris.forEach(function (d) { d.a += dt * (1.8 + d.z); d.rot += dt * 3; });
    }
    if (scene === "tsunami") {
      debris.forEach(function (d) {
        d.x += d.vx * dt * 0.4;
        d.y += Math.sin(t * 4 + d.r) * dt * 0.05;
        if (d.x < -0.1) d.x = 1.1;
      });
    }
    confetti.forEach(function (c) {
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.rot += c.rv * dt;
      if (c.y > 1.2) { c.y = -0.1; c.x = Math.random(); }
    });
    updateCoins(dt);
  }

  function drawIslandScene(ctx, w, h, t, teaser) {
    const d = state.danger;
    drawSky(ctx, w, h, "day", t, d);
    drawSun(ctx, w * 0.82, h * 0.18, 22, t);
    drawCloud(ctx, (w * 0.1 + t * 18) % (w + 80) - 40, h * 0.16, 1, 0.85);
    drawCloud(ctx, (w * 0.55 + t * 12) % (w + 80) - 40, h * 0.22, 0.75, 0.75);

    const waterY = h * 0.70;
    const amp = 8 + d * 10;
    drawWaves(ctx, w, h, waterY, t, amp, ["#38bdf8", "#0ea5e9", "#0284c7"]);

    const progress = teaser ? 3 : state.island.hut;
    const grow = 1 + (teaser ? 0.12 : (state.island.wood + state.island.hut + state.island.food) * 0.04);
    const ix = w * 0.48, iy = waterY + 8;
    const isc = Math.min(w, h) / 280 * grow;

    // island sand
    ctx.save();
    ctx.translate(ix, iy);
    ctx.scale(isc, isc);
    ctx.fillStyle = "#e0b464";
    ctx.strokeStyle = "#b45309";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 10, 110, 28, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#f4d19a";
    ctx.beginPath();
    ctx.ellipse(-6, 2, 96, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawPalm(ctx, ix + 10 * isc, iy - 6 * isc, isc * 0.7, t, -0.05);
    drawPixelTree(ctx, ix + 104 * isc, iy - 2 * isc, isc * 0.8);
    drawPineappleHouse(ctx, ix - 88 * isc, iy - 6 * isc, isc * 0.72, t);

    const hutX = ix + 40 * isc, hutY = iy - 8 * isc;
    drawHut(ctx, hutX, hutY, isc * 0.9, teaser ? 3 : progress, t);
    drawWoodPile(ctx, ix + 8 * isc, iy - 6 * isc, teaser ? 2 : state.island.wood);
    drawQuestionBlock(ctx, ix + 22 * isc, iy - 20 * isc, isc * 0.42, t);
    drawCatchBall(ctx, ix - 6 * isc, iy - 4 * isc, 7 * isc, t);
    drawJellyfish(ctx, ix - 70 * isc, waterY + 22, isc * 0.45, t, 0);
    drawJellyfish(ctx, ix + 108 * isc, waterY + 28, isc * 0.35, t, 1.7);
    drawBubbles(ctx, ix - 48 * isc, waterY + 10, t, 5);
    drawBubbles(ctx, ix + 80 * isc, waterY + 14, t + 2, 4);
    if (state.island.food || teaser) drawFish(ctx, ix + 100 * isc, waterY + 18, t);

    const boyX = ix - 32 * isc;
    const boyY = iy - 6 * isc;
    const pose = teaser ? "idle" : effectivePose();
    drawBoy(ctx, boyX, boyY, isc * 0.34, pose, t, {});
    drawYellowBuddy(ctx, boyX - 20 * isc, boyY + 1 * isc, isc * 0.2, pose === "cheer" ? "cheer" : "idle", t);

    if (!teaser && state.island.ship >= 1) {
      const sx = state.island.ship >= 2 ? w * 0.22 : w * 0.14;
      drawShip(ctx, sx, waterY - 4, Math.min(w, h) / 680, t, false);
    }
  }

  function effectivePose() {
    if (performance.now() < state.poseUntil) return state.pose;
    if (state.scene === "quake") return "brace";
    if (state.scene === "tsunami") return "brace";
    if (state.scene === "tornado" && state.tornado.basement) return "brace";
    if (state.scene === "complete") return "cheer";
    return "idle";
  }

  function drawShipScene(ctx, w, h, t) {
    const night = !state.ship.breakfast;
    drawSky(ctx, w, h, night ? "night" : "morning", t);
    if (night) {
      drawStarsSky(ctx, w, h, t);
      drawMoon(ctx, w * 0.84, h * 0.16, 20);
    } else {
      drawSun(ctx, w * 0.86, h * 0.16, 20, t);
      drawCloud(ctx, (t * 14) % (w + 60) - 30, h * 0.18, 0.9, 0.8);
    }
    const waterY = h * 0.7;
    drawWaves(ctx, w, h, waterY, t, 9 + state.danger * 6, night ? ["#164e63", "#0e7490", "#155e75"] : ["#38bdf8", "#0ea5e9", "#0284c7"]);

    const sc = Math.min(w, h) / 360;
    const sx = w * 0.55, sy = waterY - 4;
    drawShip(ctx, sx, sy, sc, t, night);
    // smoke from funnels
    drawSmoke(ctx, t, sx, sy, sc);

    // ropes on deck
    if (state.ship.ropes) {
      ctx.strokeStyle = "#b45309";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx - 40 * sc, sy - 10 * sc);
      ctx.quadraticCurveTo(sx, sy - 50 * sc, sx + 80 * sc, sy - 12 * sc);
      ctx.stroke();
    }

    const bob = Math.sin(t * 1.5) * 3;
    const boyX = sx - 58 * sc;
    const boyY = sy - 2 * sc + bob;
    drawWarpPipe(ctx, sx + 98 * sc, sy + 8 * sc + bob, sc * 0.5);
    drawQuestionBlock(ctx, sx + 16 * sc, sy - 18 * sc + bob, sc * 0.34, t);
    drawCatchBall(ctx, sx - 42 * sc, sy + 2 * sc + bob, 6.5 * sc, t);
    drawSpotCap(ctx, sx - 18 * sc, sy + 4 * sc + bob, sc * 0.36);
    drawJellyfish(ctx, w * 0.12, waterY + 22, sc * 0.4, t, 0.8);
    drawBubbles(ctx, w * 0.18, waterY + 8, t, 5);
    drawBoy(ctx, boyX, boyY, sc * 0.70, effectivePose(), t, { lifeJacket: state.ship.jackets > 0 });

    if (state.ship.breakfast >= 1) {
      // little breakfast plate near boy
      ctx.save();
      ctx.translate(boyX + 32 * sc, boyY - 6 * sc);
      ctx.scale(sc, sc);
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#f59e0b";
      ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawTsunamiScene(ctx, w, h, t) {
    drawSky(ctx, w, h, "tsunami", t, state.danger);
    drawCloud(ctx, w * 0.2, h * 0.14, 1.1, 0.5);
    const waterY = h * 0.68;
    drawWaves(ctx, w, h, waterY, t, 12 + state.danger * 10, ["#0ea5e9", "#0369a1", "#155e75"]);

    const sc = Math.min(w, h) / 380;
    const sx = w * 0.34, sy = waterY - 2;
    const tilt = -0.12 - state.danger * 0.15 - (state.step + 1) * 0.03;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(tilt + Math.sin(t * 3) * 0.04);
    ctx.translate(-sx, -sy);
    drawShip(ctx, sx, sy, sc, t, false);
    drawSmoke(ctx, t, sx, sy, sc);
    const boyX = sx - 58 * sc, boyY = sy - 2 * sc;
    drawBoy(ctx, boyX, boyY, sc * 0.66, "brace", t, { lifeJacket: true });
    ctx.restore();

    // approaching wave — closer with steps and danger
    const closeness = clamp((state.step + 1) / 3 + state.danger * 0.35, 0.25, 1.15);
    const wx = w * (1.15 - closeness * 0.7);
    drawTsunamiWave(ctx, wx, waterY, w, h, t, closeness);

    drawJellyfish(ctx, w * 0.12, waterY + 20, sc * 0.38, t, 0.4);
    drawBubbles(ctx, w * 0.2, waterY + 8, t, 6);
    drawCatchBall(ctx, w * 0.16, waterY - 6 + Math.sin(t * 2) * 4, 7, t);

    // splash particles near wave
    debris.forEach(function (d) {
      ctx.fillStyle = "rgba(224,242,254,0.85)";
      ctx.beginPath();
      ctx.arc(wx - 20 + d.x * 80, waterY - 10 + d.y * 40 + Math.sin(t * 6) * 4, d.r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawTsunamiWave(ctx, x, baseY, w, h, t, closeness) {
    ctx.save();
    const crestH = h * (0.42 + closeness * 0.12);
    const face = x;
    const back = Math.min(w + 20, x + w * 0.55);
    const grd = ctx.createLinearGradient(face, baseY - crestH, back, baseY + 40);
    grd.addColorStop(0, "#e0f2fe");
    grd.addColorStop(0.18, "#bae6fd");
    grd.addColorStop(0.4, "#38bdf8");
    grd.addColorStop(0.75, "#0369a1");
    grd.addColorStop(1, "#0c4a6e");
    ctx.fillStyle = grd;
    ctx.strokeStyle = "#164e63";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(w + 8, h);
    ctx.lineTo(w + 8, baseY);
    ctx.lineTo(back, baseY - 8);
    ctx.bezierCurveTo(back - 20, baseY - crestH * 0.45, face + 90, baseY - crestH * 0.95, face + 40, baseY - crestH);
    // curling lip
    ctx.bezierCurveTo(face + 10, baseY - crestH - 8, face - 30, baseY - crestH * 0.7, face - 10, baseY - crestH * 0.45);
    ctx.bezierCurveTo(face + 30, baseY - crestH * 0.55, face + 20, baseY - crestH * 0.25, face - 50, baseY + 8);
    ctx.quadraticCurveTo(face - 20, baseY + 18, face + 30, baseY + 14);
    ctx.lineTo(back, h);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // foam
    ctx.fillStyle = "#f8fafc";
    const lipY = baseY - crestH + 6 + Math.sin(t * 5) * 3;
    ctx.beginPath();
    ctx.arc(face + 18, lipY, 16, 0, Math.PI * 2);
    ctx.arc(face + 40, lipY + 10, 14, 0, Math.PI * 2);
    ctx.arc(face - 6, lipY + 18, 12, 0, Math.PI * 2);
    ctx.arc(face + 58, lipY + 4, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHouse(ctx, x, y, scale, opts) {
    opts = opts || {};
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const outline = "#3f2a1c";
    ctx.lineWidth = 3;
    ctx.strokeStyle = outline;

    if (opts.cutaway) {
      // basement
      ctx.fillStyle = "#57534e";
      fillRound(ctx, -74, 18, 148, 100, 4);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#292524";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-74, 18); ctx.lineTo(74, 18); ctx.stroke();
      // cutaway hash on earth
      ctx.fillStyle = "#a8a29e";
      ctx.fillRect(-88, 18, 14, 100);
      ctx.fillRect(74, 18, 14, 100);
      if (opts.supplies) {
        ctx.fillStyle = "#facc15";
        ctx.fillRect(-54, 70, 12, 22);
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(-36, 74, 10, 18);
        ctx.fillStyle = "#f97316";
        ctx.fillRect(-20, 78, 18, 12);
        ctx.strokeStyle = outline;
        ctx.strokeRect(-54, 70, 12, 22);
      }
    }

    // house body
    ctx.fillStyle = "#fef3c7";
    ctx.strokeStyle = outline;
    fillRound(ctx, -70, -80, 140, 100, 3);
    ctx.fill(); ctx.stroke();

    // roof
    ctx.fillStyle = "#c2410c";
    ctx.beginPath();
    ctx.moveTo(-84, -74);
    ctx.lineTo(0, -130);
    ctx.lineTo(84, -74);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // chimney
    ctx.fillStyle = "#78716c";
    ctx.fillRect(40, -120, 16, 28);
    ctx.strokeRect(40, -120, 16, 28);

    // door
    ctx.fillStyle = "#92400e";
    fillRound(ctx, -14, -20, 28, 40, 3);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(8, 0, 3, 0, Math.PI * 2); ctx.fill();

    // windows
    function windowPane(wx, wy, boarded) {
      ctx.save();
      ctx.translate(wx, wy);
      ctx.fillStyle = boarded ? "#92400e" : "#7dd3fc";
      fillRound(ctx, -16, -14, 32, 28, 2);
      ctx.fill(); ctx.strokeStyle = outline; ctx.lineWidth = 3; ctx.stroke();
      if (boarded) {
        ctx.strokeStyle = "#5c3a1a";
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-14, -12); ctx.lineTo(14, 12);
        ctx.moveTo(14, -12); ctx.lineTo(-14, 12); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 14);
        ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.stroke();
      }
      ctx.restore();
    }
    windowPane(-42, -48, opts.windows);
    windowPane(42, -48, opts.windows);

    ctx.restore();
  }

  function drawTornadoFunnel(ctx, x, y, t, danger) {
    ctx.save();
    ctx.translate(x, y);
    const h = 220 + danger * 40;
    for (let i = 0; i < 18; i++) {
      const p = i / 18;
      const yy = -h + p * h;
      const rr = 8 + p * (42 + danger * 18);
      const ox = Math.sin(t * 4 + p * 8) * (10 + p * 16);
      ctx.fillStyle = "rgba(" + Math.round(80 + p * 30) + "," + Math.round(70 + p * 20) + "," + Math.round(110 + p * 20) + "," + (0.5 + p * 0.4) + ")";
      ctx.beginPath();
      ctx.ellipse(ox, yy, rr, 10 + p * 6, Math.sin(t * 2 + p) * 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
    // swirling cloud cap
    ctx.fillStyle = "rgba(71,85,105,0.75)";
    ctx.beginPath();
    ctx.ellipse(0, -h + 10, 80, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawTornadoScene(ctx, w, h, t) {
    drawSky(ctx, w, h, "storm", t, state.danger + state.step * 0.08);
    // rain
    ctx.strokeStyle = "rgba(226,232,240,0.55)";
    ctx.lineWidth = 1.4;
    rain.forEach(function (r) {
      const x = r.x * w, y = r.y * h;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 4, y + r.len); ctx.stroke();
    });

    const ground = h * 0.78;
    ctx.fillStyle = "#4d7c0f";
    ctx.fillRect(0, ground, w, h - ground);
    ctx.fillStyle = "#3f6212";
    ctx.fillRect(0, ground, w, 8);

    const closeness = 0.55 + state.danger * 0.2 + state.step * 0.05;
    const tx = w * (0.72 - state.danger * 0.08);
    const ty = ground - 10;
    drawTornadoFunnel(ctx, tx, ty, t, state.danger);
    debris.forEach(function (d) {
      const x = tx + Math.cos(d.a) * d.r * closeness;
      const y = ty - 80 + Math.sin(d.a * 2) * 50 - d.r * 0.4;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(d.rot);
      ctx.fillStyle = d.kind === 0 ? "#92400e" : (d.kind === 1 ? "#64748b" : "#a3a3a3");
      ctx.fillRect(-d.s, -3, d.s * 2, 6);
      ctx.restore();
    });

    const hs = Math.min(w, h) / 420;
    const hx = w * 0.32, hy = ground;
    const cutaway = state.tornado.basement > 0;
    drawHouse(ctx, hx, hy, hs, {
      windows: state.tornado.windows > 0,
      supplies: state.tornado.supplies > 0,
      cutaway: cutaway
    });

    drawPixelTree(ctx, hx - 150 * hs, ground, hs * 0.85);
    drawWarpPipe(ctx, hx + 100 * hs, ground, hs * 0.55);
    drawBlockMob(ctx, hx - 125 * hs, ground, hs * 0.48, t);
    drawQuestionBlock(ctx, hx + 58 * hs, ground - 18 * hs, hs * 0.4, t);

    if (cutaway) {
      drawBoy(ctx, hx - 6 * hs, hy + 104 * hs, hs * 0.56, "brace", t, {});
    } else {
      drawBoy(ctx, hx - 95 * hs, hy - 2 * hs, hs * 0.70, effectivePose(), t, {});
    }
  }

  function drawQuakeScene(ctx, w, h, t) {
    const shakeAmt = (0.25 + state.danger * 0.7 + (state.quake.checked ? 0.05 : 0.35)) * (REDUCE ? 0 : 1);
    const sx = Math.sin(t * 22) * 5 * shakeAmt;
    const sy = Math.cos(t * 19) * 3 * shakeAmt;
    ctx.save();
    ctx.translate(sx, sy);

    drawSky(ctx, w, h, "room", t);
    // interior walls
    ctx.fillStyle = "#ffedd5";
    ctx.fillRect(0, 0, w, h);
    // back wall
    ctx.fillStyle = "#fed7aa";
    ctx.fillRect(0, 0, w, h * 0.62);
    // floor
    ctx.fillStyle = "#b45309";
    ctx.fillRect(0, h * 0.7, w, h * 0.3);
    ctx.fillStyle = "#92400e";
    for (let i = 0; i < 8; i++) {
      ctx.fillRect(0, h * 0.7 + i * 10, w, 2);
    }

    // window
    ctx.fillStyle = "#7dd3fc";
    ctx.strokeStyle = "#3f2a1c";
    ctx.lineWidth = 4;
    fillRound(ctx, w * 0.62, h * 0.14, w * 0.28, h * 0.32, 4);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w * 0.76, h * 0.14); ctx.lineTo(w * 0.76, h * 0.46);
    ctx.moveTo(w * 0.62, h * 0.3); ctx.lineTo(w * 0.9, h * 0.3);
    ctx.stroke();

    // cracks
    const cracks = state.danger * 3 + state.step;
    ctx.strokeStyle = "rgba(69,26,3,0.65)";
    ctx.lineWidth = 2;
    if (cracks > 0.3) {
      ctx.beginPath();
      ctx.moveTo(w * 0.12, h * 0.1);
      ctx.lineTo(w * 0.18, h * 0.22);
      ctx.lineTo(w * 0.14, h * 0.34);
      ctx.lineTo(w * 0.2, h * 0.5);
      ctx.stroke();
    }
    if (cracks > 0.8) {
      ctx.beginPath();
      ctx.moveTo(w * 0.5, h * 0.08);
      ctx.lineTo(w * 0.47, h * 0.2);
      ctx.lineTo(w * 0.52, h * 0.3);
      ctx.stroke();
    }

    // swinging lamp
    const lampX = w * 0.4;
    const lampAng = Math.sin(t * 4.2) * (0.25 + shakeAmt * 0.5);
    ctx.save();
    ctx.translate(lampX, 0);
    ctx.rotate(lampAng);
    ctx.strokeStyle = "#3f2a1c";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, h * 0.2); ctx.stroke();
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.moveTo(-16, h * 0.18);
    ctx.lineTo(16, h * 0.18);
    ctx.lineTo(12, h * 0.22);
    ctx.lineTo(-12, h * 0.22);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(253, 224, 71, 0.45)";
    ctx.beginPath(); ctx.ellipse(0, h * 0.255, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fde68a";
    ctx.beginPath(); ctx.ellipse(0, h * 0.235, 8, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();

    // sturdy table (large enough for the boy to sit under)
    const tblX = w * 0.34, tblY = h * 0.78;
    const ts = Math.min(w, h) / 340;
    ctx.fillStyle = "#92400e";
    ctx.strokeStyle = "#3f2a1c";
    ctx.lineWidth = 3;
    ctx.fillRect(tblX - 96 * ts, tblY - 132 * ts, 192 * ts, 16 * ts);
    ctx.strokeRect(tblX - 96 * ts, tblY - 132 * ts, 192 * ts, 16 * ts);
    ctx.fillRect(tblX - 86 * ts, tblY - 116 * ts, 16 * ts, 116 * ts);
    ctx.fillRect(tblX + 70 * ts, tblY - 116 * ts, 16 * ts, 116 * ts);
    ctx.strokeRect(tblX - 86 * ts, tblY - 116 * ts, 16 * ts, 116 * ts);
    ctx.strokeRect(tblX + 70 * ts, tblY - 116 * ts, 16 * ts, 116 * ts);

    // shelf + items
    ctx.fillStyle = "#78350f";
    ctx.fillRect(w * 0.08, h * 0.36, w * 0.22, 8);
    const fall = !state.quake.secured && (state.danger > 0.15 || state.step >= 1);
    const itemY = fall ? h * 0.36 + clamp((t * 40) % 120, 0, h * 0.34) : h * 0.36 - 4;
    if (!state.quake.secured) {
      ctx.fillStyle = "#dc2626";
      ctx.fillRect(w * 0.12, itemY - 16, 14, 16);
      ctx.fillStyle = "#2563eb";
      ctx.fillRect(w * 0.18, itemY - 12, 18, 12);
    } else {
      ctx.fillStyle = "#dc2626";
      ctx.fillRect(w * 0.12, h * 0.36 - 16, 14, 16);
      ctx.fillStyle = "#2563eb";
      ctx.fillRect(w * 0.18, h * 0.36 - 12, 18, 12);
    }

    // picture frame swinging
    ctx.save();
    ctx.translate(w * 0.5, h * 0.18);
    ctx.rotate(Math.sin(t * 5) * 0.2 * (0.4 + shakeAmt));
    ctx.fillStyle = "#fef3c7";
    ctx.strokeStyle = "#92400e";
    ctx.lineWidth = 5;
    ctx.strokeRect(-18, 0, 36, 28);
    ctx.fillRect(-18, 0, 36, 28);
    ctx.fillStyle = "#86efac";
    ctx.fillRect(-12, 6, 24, 16);
    ctx.restore();

    drawQuestionBlock(ctx, w * 0.24, (state.quake.secured ? h * 0.36 - 4 : itemY) - 2, ts * 0.42, t);
    drawSpotCap(ctx, w * 0.74, h * 0.7, ts * 0.7);
    drawCatchBall(ctx, w * 0.58, h * 0.7 - 2, 9, t);
    drawPixelBlock(ctx, w * 0.08, h * 0.7, 16, 16, "#c4a36a", "#8b5a2b");

    // boy under table — feet on the floor, head under the tabletop
    drawBoy(ctx, tblX, tblY - 2, ts * 0.95, "brace", t, {});

    ctx.restore();
  }

  function drawCompleteScene(ctx, w, h, t) {
    drawSky(ctx, w, h, "win", t);
    drawSun(ctx, w * 0.82, h * 0.18, 24, t);
    drawCloud(ctx, (t * 16) % (w + 80) - 40, h * 0.2, 1, 0.85);
    const ground = h * 0.72;
    ctx.fillStyle = "#4d7c0f";
    ctx.fillRect(0, ground, w, h - ground);
    ctx.fillStyle = "#65a30d";
    ctx.beginPath();
    ctx.ellipse(w * 0.5, ground + 8, w * 0.4, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    const cs = Math.min(w, h);
    drawPineappleHouse(ctx, w * 0.14, ground, cs / 360, t);
    drawPixelTree(ctx, w * 0.28, ground, cs / 340);
    drawHut(ctx, w * 0.78, ground, cs / 400, 3, t);
    drawWarpPipe(ctx, w * 0.9, ground, cs / 420);
    drawBlockMob(ctx, w * 0.68, ground, cs / 420, t);
    drawSpotCap(ctx, w * 0.62, ground, cs / 400);
    drawCatchBall(ctx, w * 0.33, ground - 4, 9, t);
    drawBoy(ctx, w * 0.46, ground - 4, cs / 500, "cheer", t, {});
    drawYellowBuddy(ctx, w * 0.34, ground - 2, cs / 620, "cheer", t);
    // trophy
    ctx.save();
    ctx.translate(w * 0.58, ground - 8);
    ctx.fillStyle = "#f59e0b";
    ctx.strokeStyle = "#b45309";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillRect(-6, 10, 12, 10);
    ctx.fillRect(-12, 20, 24, 6);
    ctx.restore();

    confetti.forEach(function (c) {
      ctx.save();
      ctx.translate(c.x * w, c.y * h);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.c;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    });
  }

  function drawTitleScene(ctx, w, h, t) {
    drawIslandScene(ctx, w, h, t, true);
  }

  /* ===== Pixar 3D backgrounds + boy sprites (overrides earlier vector drawers) ===== */
  const ASSET_VER = "pixar2";
  const BOY_META = {
    idle:  { footX: 0.445, footY: 0.997 },
    cheer: { footX: 0.599, footY: 0.996 },
    brace: { footX: 0.524, footY: 0.997 }
  };
  const ASSETS = { boy: {}, bg: {}, hut: {} };
  let assetsReady = false;
  let assetsPromise = null;
  let rainDrops = [];
  let leafBits = [];
  let splashBits = [];

  const SCENE_LAYOUT = {
    island:        { bg: "island",       focus: [0.48, 0.62], boyPlace: "image",  boy: [0.38, 0.74], boyH: 0.42 },
    "ship-night":  { bg: "ship-night",   focus: [0.50, 0.58], boyPlace: "canvas", boy: [0.20, 0.92], boyH: 0.42 },
    "ship-morning":{ bg: "ship-morning", focus: [0.48, 0.62], boyPlace: "image",  boy: [0.52, 0.76], boyH: 0.40 },
    tsunami:       { bg: "tsunami",      focus: [0.42, 0.55], boyPlace: "canvas", boy: [0.18, 0.92], boyH: 0.40 },
    tornado:       { bg: "tornado",      focus: [0.38, 0.55], boyPlace: "image",  boy: [0.22, 0.86], boyH: 0.40 },
    basement:      { bg: "basement",     focus: [0.46, 0.68], boyPlace: "image",  boy: [0.40, 0.88], boyH: 0.42 },
    quake:         { bg: "quake",        focus: [0.42, 0.64], boyPlace: "image",  boy: [0.40, 0.84], boyH: 0.36 },
    complete:      { bg: "complete",     focus: [0.50, 0.64], boyPlace: "image",  boy: [0.52, 0.93], boyH: 0.36 }
  };

  function loadImagePair(webp, fallback) {
    return new Promise(function (resolve, reject) {
      const im = new Image();
      im.onload = function () { resolve(im); };
      im.onerror = function () {
        const im2 = new Image();
        im2.onload = function () { resolve(im2); };
        im2.onerror = function () { reject(new Error("failed " + fallback)); };
        im2.src = fallback + "?v=" + ASSET_VER;
      };
      im.src = webp + "?v=" + ASSET_VER;
    });
  }

  function startAssetLoad() {
    if (assetsPromise) return assetsPromise;
    const jobs = [];
    ["idle", "cheer", "brace"].forEach(function (p) {
      jobs.push(loadImagePair("boy-" + p + ".webp", "boy-" + p + ".png").then(function (im) { ASSETS.boy[p] = im; }));
    });
    ["island", "ship-night", "ship-morning", "tsunami", "tornado", "basement", "quake", "complete"].forEach(function (k) {
      jobs.push(loadImagePair("bg-" + k + ".webp", "bg-" + k + ".jpg").then(function (im) { ASSETS.bg[k] = im; }));
    });
    [1, 2, 3, 4].forEach(function (n) {
      jobs.push(loadImagePair("hut-" + n + ".webp", "hut-" + n + ".png").then(function (im) { ASSETS.hut[n] = im; }));
    });
    assetsPromise = Promise.all(jobs.map(function (j) {
      return j.catch(function (err) { console.warn(err); return null; });
    })).then(function () {
      assetsReady = true;
      try { renderUI(); } catch (e) {}
    });
    return assetsPromise;
  }

  function layoutKeyFor(scene, teaser) {
    if (teaser || scene === "title") return "island";
    if (scene === "ship") {
      const breakfast = state.ship && (state.ship.breakfast >= 1 || (currentStep() && currentStep().id === "breakfast"));
      return breakfast ? "ship-morning" : "ship-night";
    }
    if (scene === "tornado") return (state.tornado && state.tornado.basement) ? "basement" : "tornado";
    return scene;
  }

  function kenBurnsZoom(t, extra) {
    if (REDUCE) return 1.02 + (extra || 0);
    return 1.02 + 0.03 * Math.sin(t * 0.22) + (extra || 0);
  }

  function coverTransform(img, w, h, zoom, fx, fy) {
    zoom = zoom || 1;
    fx = fx == null ? 0.5 : fx;
    fy = fy == null ? 0.55 : fy;
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const scale = Math.max(w / iw, h / ih) * zoom;
    const dw = iw * scale, dh = ih * scale;
    let dx = w * 0.5 - fx * dw;
    let dy = h * 0.5 - fy * dh;
    dx = Math.min(0, Math.max(w - dw, dx));
    dy = Math.min(0, Math.max(h - dh, dy));
    return { dx: dx, dy: dy, dw: dw, dh: dh, scale: scale };
  }

  function imageToCanvas(tf, ux, uy) {
    return { x: tf.dx + ux * tf.dw, y: tf.dy + uy * tf.dh };
  }

  function drawCoverBg(ctx, img, w, h, zoom, fx, fy) {
    if (!img) {
      ctx.fillStyle = "#7ec8e3";
      ctx.fillRect(0, 0, w, h);
      return null;
    }
    const tf = coverTransform(img, w, h, zoom, fx, fy);
    ctx.drawImage(img, tf.dx, tf.dy, tf.dw, tf.dh);
    return tf;
  }

  function drawBoy(ctx, x, y, heightPx, pose, t) {
    pose = (pose === "cheer" || pose === "brace") ? pose : "idle";
    const img = ASSETS.boy[pose] || ASSETS.boy.idle;
    if (!img) return;
    const meta = BOY_META[pose] || BOY_META.idle;
    const ih = img.naturalHeight || img.height;
    const iw = img.naturalWidth || img.width;
    const bob = pose === "idle" ? Math.sin(t * 2.1) * (heightPx * 0.012) : 0;
    const hop = pose === "cheer" ? Math.abs(Math.sin(t * 6.2)) * (heightPx * 0.06) : 0;
    const squashY = pose === "idle" ? 1 + Math.sin(t * 2.1) * 0.015
      : (pose === "cheer" ? 1 - Math.abs(Math.sin(t * 6.2)) * 0.04 : 1);
    const tilt = pose === "brace" ? Math.sin(t * 10) * 0.06 : 0;
    const shakeX = pose === "brace" ? Math.sin(t * 18) * (heightPx * 0.012) : 0;
    const scale = heightPx / ih;
    const dw = iw * scale;
    const dh = ih * scale * squashY;
    const footOffX = meta.footX * dw;
    ctx.save();
    ctx.fillStyle = "rgba(20, 16, 10, 0.20)";
    ctx.beginPath();
    ctx.ellipse(x + shakeX, y + 3, dw * 0.26, Math.max(5, dh * 0.036), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.translate(x + shakeX, y - hop + bob);
    ctx.rotate(tilt);
    ctx.drawImage(img, -footOffX, -dh * meta.footY, dw, dh);
    ctx.restore();
  }

  function islandHutStage(teaser) {
    if (teaser) return 4;
    if (state.island && state.island.ship >= 1) return 4;
    const hut = (state.island && state.island.hut) || 0;
    return hut;
  }

  function drawHutOverlay(ctx, tf, stage, w, h) {
    if (!stage) return;
    const img = ASSETS.hut[Math.max(1, Math.min(4, stage))];
    if (!img || !tf) return;
    const p = imageToCanvas(tf, 0.52, 0.68);
    const targetH = h * (stage >= 4 ? 0.36 : 0.32);
    const scale = targetH / (img.naturalHeight || img.height);
    const dw = (img.naturalWidth || img.width) * scale;
    const dh = (img.naturalHeight || img.height) * scale;
    ctx.drawImage(img, p.x - dw * 0.5, p.y - dh * 0.96, dw, dh);
  }

  function drawHutCaption(ctx, tf, stage, wood) {
    if (!tf) return;
    const labels = ["Gathering wood", "Frame up!", "Walls are up!", "Roof is going on!", "Hut is ready!"];
    let key = stage;
    if (!stage && wood > 0) key = 0;
    if (key == null || key < 0) return;
    if (!stage && !wood) return;
    const label = labels[Math.max(0, Math.min(4, key))];
    const p = imageToCanvas(tf, 0.52, 0.70);
    ctx.save();
    ctx.font = "700 13px system-ui, -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const tw = ctx.measureText(label).width;
    const bw = tw + 20, bh = 24;
    const x = p.x, y = p.y + 18;
    ctx.fillStyle = "rgba(15, 23, 42, 0.62)";
    ctx.beginPath();
    const r = 12;
    ctx.moveTo(x - bw / 2 + r, y - bh / 2);
    ctx.arcTo(x + bw / 2, y - bh / 2, x + bw / 2, y + bh / 2, r);
    ctx.arcTo(x + bw / 2, y + bh / 2, x - bw / 2, y + bh / 2, r);
    ctx.arcTo(x - bw / 2, y + bh / 2, x - bw / 2, y - bh / 2, r);
    ctx.arcTo(x - bw / 2, y - bh / 2, x + bw / 2, y - bh / 2, r);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#fff7ed";
    ctx.fillText(label, x, y + 0.5);
    ctx.restore();
  }

  function resetSceneFx() {
    rainDrops = [];
    leafBits = [];
    splashBits = [];
  }

  function spawnRain(w, h) {
    return {
      x: Math.random() * 1.2 - 0.1,
      y: Math.random() * -0.2,
      len: 0.025 + Math.random() * 0.04,
      spd: 0.55 + Math.random() * 0.7,
      a: 0.18 + Math.random() * 0.28
    };
  }

  function spawnLeaf() {
    return {
      x: 0.1 + Math.random() * 0.9,
      y: Math.random() * 0.7,
      vx: 0.08 + Math.random() * 0.16,
      vy: 0.02 + Math.random() * 0.08,
      rot: Math.random() * Math.PI * 2,
      rv: (Math.random() - 0.5) * 6,
      s: 6 + Math.random() * 8,
      c: ["#4d7c0f", "#65a30d", "#a3a300", "#3f6212", "#854d0e"][Math.floor(Math.random() * 5)]
    };
  }

  function spawnSplash() {
    return {
      x: 0.55 + Math.random() * 0.42,
      y: 0.45 + Math.random() * 0.45,
      vx: (Math.random() - 0.3) * 0.08,
      vy: -0.08 - Math.random() * 0.12,
      life: 0.5 + Math.random() * 0.7,
      r: 2 + Math.random() * 5,
      kind: Math.random() < 0.35 ? "spark" : "drop"
    };
  }

  function updateSceneFx(dt, scene, t, w, h) {
    const tornadoOut = scene === "tornado" && !(state.tornado && state.tornado.basement);
    if (tornadoOut && !REDUCE) {
      while (rainDrops.length < 80) rainDrops.push(spawnRain(w, h));
      while (leafBits.length < 14) leafBits.push(spawnLeaf());
    } else {
      rainDrops.length = 0;
      if (!tornadoOut) leafBits.length = 0;
    }
    for (let i = rainDrops.length - 1; i >= 0; i--) {
      const r = rainDrops[i];
      r.y += r.spd * dt;
      r.x += 0.12 * dt;
      if (r.y > 1.05) {
        r.y = -0.08;
        r.x = Math.random() * 1.2 - 0.1;
      }
    }
    for (let i = leafBits.length - 1; i >= 0; i--) {
      const L = leafBits[i];
      L.x += L.vx * dt;
      L.y += L.vy * dt + Math.sin(t * 3 + L.rot) * 0.04 * dt;
      L.rot += L.rv * dt;
      if (L.x > 1.1 || L.y > 1.1) {
        L.x = -0.05;
        L.y = Math.random() * 0.7;
      }
    }
    if (scene === "tsunami" && !REDUCE) {
      while (splashBits.length < 22) splashBits.push(spawnSplash());
      for (let i = splashBits.length - 1; i >= 0; i--) {
        const s = splashBits[i];
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += 0.18 * dt;
        s.life -= dt;
        if (s.life <= 0) splashBits[i] = spawnSplash();
      }
    } else {
      splashBits.length = 0;
    }
  }

  function drawRainAndLeaves(ctx, w, h) {
    if (!rainDrops.length && !leafBits.length) return;
    ctx.save();
    rainDrops.forEach(function (r) {
      ctx.strokeStyle = "rgba(210, 228, 245," + r.a + ")";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(r.x * w, r.y * h);
      ctx.lineTo(r.x * w - 4, (r.y + r.len) * h);
      ctx.stroke();
    });
    leafBits.forEach(function (L) {
      ctx.save();
      ctx.translate(L.x * w, L.y * h);
      ctx.rotate(L.rot);
      ctx.fillStyle = L.c;
      ctx.beginPath();
      ctx.ellipse(0, 0, L.s, L.s * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    ctx.restore();
  }

  function drawSplashes(ctx, w, h) {
    splashBits.forEach(function (s) {
      const a = Math.max(0, Math.min(1, s.life));
      ctx.save();
      ctx.globalAlpha = a * 0.85;
      if (s.kind === "spark") {
        ctx.fillStyle = "#fff7ed";
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * h, s.r * 0.7, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = "rgba(224, 246, 255, 0.95)";
        ctx.beginPath();
        ctx.ellipse(s.x * w, s.y * h, s.r, s.r * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
  }

  function drawConfetti(ctx, w, h) {
    if (!confetti || !confetti.length) return;
    confetti.forEach(function (c) {
      ctx.save();
      ctx.translate(c.x * w, c.y * h);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.c;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    });
  }

  function withSceneMotion(ctx, w, h, t, scene, fn) {
    ctx.save();
    let sx = 0, sy = 0, rot = 0;
    if (!REDUCE) {
      if (scene === "tsunami") {
        const c = Math.min(1, ((state.step || 0) + 1) / 3 + (state.danger || 0) * 0.45);
        const mag = 1.2 + c * 4;
        sx = Math.sin(t * 22) * mag;
        sy = Math.cos(t * 17) * mag * 0.6;
      } else if (scene === "quake") {
        const mag = 2.4 + (state.danger || 0) * 5;
        sx = Math.sin(t * 28) * mag;
        sy = Math.cos(t * 23) * mag * 0.7;
        rot = Math.sin(t * 3.2) * 0.012;
      }
    }
    if (sx || sy || rot) {
      ctx.translate(w / 2 + sx, h / 2 + sy);
      ctx.rotate(rot);
      ctx.translate(-w / 2, -h / 2);
    }
    fn();
    ctx.restore();
  }

  function placeBoy(layout, tf, w, h) {
    if (layout.boyPlace === "canvas" || !tf) {
      return { x: layout.boy[0] * w, y: layout.boy[1] * h };
    }
    return imageToCanvas(tf, layout.boy[0], layout.boy[1]);
  }

  function drawPhotoScene(ctx, w, h, t, key, pose, opts) {
    opts = opts || {};
    const layout = SCENE_LAYOUT[key] || SCENE_LAYOUT.island;
    const img = ASSETS.bg[layout.bg];
    let extraZoom = opts.extraZoom || 0;
    let fx = layout.focus[0] + (opts.focusShiftX || 0);
    let fy = layout.focus[1] + (opts.focusShiftY || 0);
    const zoom = kenBurnsZoom(t, extraZoom);
    const tf = drawCoverBg(ctx, img, w, h, zoom, fx, fy);
    if (opts.afterBg) opts.afterBg(ctx, tf, w, h);
    const p = placeBoy(layout, tf, w, h);
    const boyH = h * layout.boyH;
    drawBoy(ctx, p.x, p.y, boyH, pose, t);
    if (opts.afterBoy) opts.afterBoy(ctx, tf, w, h);
  }

  function drawIslandScene(ctx, w, h, t, teaser) {
    const pose = teaser ? "idle" : effectivePose();
    const stage = islandHutStage(teaser);
    const wood = teaser ? 2 : ((state.island && state.island.wood) || 0);
    drawPhotoScene(ctx, w, h, t, "island", pose, {
      afterBg: function (ctx, tf) {
        drawHutOverlay(ctx, tf, stage, w, h);
        if (!teaser) drawHutCaption(ctx, tf, stage, wood);
      }
    });
  }

  function drawShipScene(ctx, w, h, t) {
    const key = layoutKeyFor("ship");
    drawPhotoScene(ctx, w, h, t, key, effectivePose());
  }

  function drawTsunamiScene(ctx, w, h, t) {
    const closeness = Math.min(1, ((state.step || 0) + 1) / 3 + (state.danger || 0) * 0.4);
    drawPhotoScene(ctx, w, h, t, "tsunami", effectivePose(), {
      extraZoom: closeness * 0.08,
      focusShiftX: closeness * 0.12,
      afterBoy: function () { drawSplashes(ctx, w, h); }
    });
  }

  function drawTornadoScene(ctx, w, h, t) {
    const key = layoutKeyFor("tornado");
    drawPhotoScene(ctx, w, h, t, key, effectivePose(), {
      afterBoy: function () {
        if (key === "tornado") drawRainAndLeaves(ctx, w, h);
      }
    });
  }

  function drawQuakeScene(ctx, w, h, t) {
    drawPhotoScene(ctx, w, h, t, "quake", effectivePose());
  }

  function drawCompleteScene(ctx, w, h, t) {
    drawPhotoScene(ctx, w, h, t, "complete", "cheer");
    drawConfetti(ctx, w, h);
  }

  function drawTitleScene(ctx, w, h, t) {
    drawIslandScene(ctx, w, h, t, true);
  }

  function drawBoyCloseScene(ctx, w, h, t) {
    const img = ASSETS.bg.island;
    if (img) drawCoverBg(ctx, img, w, h, 1.85, 0.36, 0.72);
    else { ctx.fillStyle = "#9dd4f0"; ctx.fillRect(0, 0, w, h); }
    drawBoy(ctx, w * 0.5, h * 0.94, h * 0.82, effectivePose() || "idle", t);
  }

  function drawBoyPortraitScene(ctx, w, h, t) {
    const img = ASSETS.bg.island;
    if (img) drawCoverBg(ctx, img, w, h, 1.35, 0.38, 0.70);
    else { ctx.fillStyle = "#9dd4f0"; ctx.fillRect(0, 0, w, h); }
    drawBoy(ctx, w * 0.5, h * 0.92, h * 0.62, effectivePose() || "idle", t);
  }

  function drawLoading(ctx, w, h) {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#f8fafc";
    ctx.font = "600 20px system-ui, -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Loading the adventure…", w / 2, h / 2);
  }

  let lastFrame = performance.now();
  function tick(ts) {
    const dt = Math.min(0.05, (ts - lastFrame) / 1000);
    lastFrame = ts;
    const dim = sizeCanvas();
    const w = dim.w, h = dim.h;
    const t = animT();
    const sc = state.scene;
    ctx.clearRect(0, 0, w, h);
    if (!assetsReady) {
      drawLoading(ctx, w, h);
      requestAnimationFrame(tick);
      return;
    }
    updateParticles(dt, sc, t, w, h);
    updateSceneFx(dt, sc, t, w, h);
    withSceneMotion(ctx, w, h, t, sc, function () {
      if (sc === "title") drawTitleScene(ctx, w, h, t);
      else if (sc === "island") drawIslandScene(ctx, w, h, t, false);
      else if (sc === "ship") drawShipScene(ctx, w, h, t);
      else if (sc === "tsunami") drawTsunamiScene(ctx, w, h, t);
      else if (sc === "tornado") drawTornadoScene(ctx, w, h, t);
      else if (sc === "quake") drawQuakeScene(ctx, w, h, t);
      else if (sc === "complete") drawCompleteScene(ctx, w, h, t);
      else if (sc === "boyclose") drawBoyCloseScene(ctx, w, h, t);
      else if (sc === "boyportrait") drawBoyPortraitScene(ctx, w, h, t);
      else drawIslandScene(ctx, w, h, t, true);
    });
    drawFx(ctx, w, h);
    requestAnimationFrame(tick);
  }

  function setupShot(name) {
    state = initial();
    lastScene = "";
    if (name === "level1") {
      state.scene = "island";
      state.step = 3;
      state.survival = 3;
      state.island = { wood: 2, hut: 2, food: 0, ship: 0, palms: 2 };
      state.problems = makeProblems(6);
      state.problem = state.problems[3];
      state.pose = "work";
    } else if (name === "level1-ship") {
      state.scene = "ship";
      state.step = 1;
      state.survival = 1;
      state.ship = { jackets: 2, ropes: 1, breakfast: 0 };
      state.problems = makeProblems(3);
      state.problem = state.problems[1];
    } else if (name === "level1-tsunami") {
      state.scene = "tsunami";
      state.step = 1;
      state.survival = 1;
      state.danger = 0.25;
      state.ship = { jackets: 2, ropes: 2, breakfast: 2 };
      state.problems = makeProblems(3);
      state.problem = state.problems[1];
      state.pose = "brace";
    } else if (name === "level2-tornado") {
      state.scene = "tornado";
      state.step = 2;
      state.survival = 2;
      state.tornado = { windows: 2, supplies: 2, basement: 1 };
      state.problems = makeProblems(4);
      state.problem = state.problems[2];
      state.pose = "brace";
    } else if (name === "level3-quake") {
      state.scene = "quake";
      state.step = 1;
      state.survival = 1;
      state.danger = 0.3;
      state.quake = { underTable: 1, secured: 0, checked: 0 };
      state.problems = makeProblems(4);
      state.problem = state.problems[1];
      state.pose = "brace";
    } else if (name === "complete") {
      state.scene = "complete";
      state.stars = 40;
      state.pose = "cheer";
      burstConfetti();
    } else if (name === "level1-breakfast") {
      state.scene = "ship";
      state.step = 2;
      state.survival = 2;
      state.ship = { jackets: 2, ropes: 2, breakfast: 1 };
      state.problems = makeProblems(3);
      state.problem = state.problems[2];
      state.pose = "idle";
    } else if (name === "level2-yard") {
      state.scene = "tornado";
      state.step = 0;
      state.survival = 0;
      state.tornado = { windows: 0, supplies: 0, basement: 0 };
      state.problems = makeProblems(4);
      state.problem = state.problems[0];
      state.pose = "brace";
    } else if (name === "level1-hutdone") {
      state.scene = "island";
      state.step = 5;
      state.survival = 5;
      state.island = { wood: 2, hut: 3, food: 1, ship: 2, palms: 2 };
      state.problems = makeProblems(6);
      state.problem = state.problems[5];
      state.pose = "cheer";
    } else if (name === "boy-close") {
      state.scene = "boyclose";
      state.pose = "idle";
    } else if (name === "boy-portrait") {
      state.scene = "boyportrait";
      state.pose = "idle";
    }
    resetParticles(state.scene);
    renderUI();
  }

  window.__SURVIVAL_GAME__ = {
    getState: function () { return JSON.parse(JSON.stringify(state)); },
    getScene: function () { return state.scene; },
    startNew: startNew,
    handle: function (act, btn) {
      if (act === "newGame") startNew();
      else if (act === "continue") continueGame();
      else if (act && act.indexOf("ans_") === 0) onAnswer(Number(act.slice(4)), btn);
    },
    solveCurrent: function () {
      if (!state.problem) return false;
      onAnswer(state.problem.answer);
      return true;
    },
    setupShot: setupShot,
    makeProblems: makeProblems,
    assetsReady: function () { return assetsReady; },
    whenAssets: function () { return assetsPromise || startAssetLoad(); }
  };

  window.addEventListener("resize", function () { sizeCanvas(); });
  renderUI();
  resetParticles("title");
  startAssetLoad();
  requestAnimationFrame(tick);
})();
  </script>
</body>
